name: fusuma_watari

on:
  push:
    paths:
      - 'apps/fusuma_watari/**'
      - '.github/workflows/fusuma_watari.yml'
  pull_request:
    paths:
      - 'apps/fusuma_watari/**'
      - '.github/workflows/fusuma_watari.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/fusuma_watari

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Without android/key.properties the release build is signed with the
      # debug key: good enough to check that it builds and to install locally.
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: fusuma_watari-apk
          path: apps/fusuma_watari/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Unsigned build: checks that the iOS project compiles.
      - run: flutter build ios --release --no-codesign
