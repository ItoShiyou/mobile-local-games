<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>出前ねこ 次の一皿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
  /* One look on purpose: the washi-and-wood shop of つみあげ出前, in daylight. */
  :root {
    color-scheme: light;
    --paper: #F3EAD8; --paper-deep: #E6D6BA; --card: #FBF5EA; --ink: #3A2B22; --ink-soft: #7D6754;
    --wood: #C6955F; --wood-light: #E0B985; --wood-dark: #7E5535; --noren: #2F4B6B; --on-noren: #F6EEDF;
    --shu: #C8452F; --glow: #FFC56B; --board: #2F3A31;
    --display: "Yusei Magic", "Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif;
    --body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "BIZ UDPGothic", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { background: var(--paper); color: var(--ink); }
  body {
    margin: 0; font-family: var(--body); font-weight: 500; font-size: 15px; line-height: 1.6;
    background-image:
      radial-gradient(rgba(125,103,84,.07) 1px, transparent 1.2px),
      radial-gradient(rgba(125,103,84,.05) 1px, transparent 1.2px);
    background-size: 7px 7px, 11px 11px; background-position: 0 0, 3px 5px;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 0 32px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--glow); outline-offset: 2px; }

  /* noren banner */
  .noren { position: relative; margin-inline: -16px; padding-top: 12px; background: var(--wood-dark); }
  .noren::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 10px; background: #5E3E27; border-bottom: 2px solid var(--ink); }
  .panels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
  .panels i { display: block; height: 100%; background: var(--noren); border-radius: 0 0 5px 5px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }
  .noren-text { position: absolute; inset: 12px 0 0 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--on-noren); text-align: center; padding-inline: 12px; }
  .menu-noren .panels { height: 132px; }
  .menu-noren h1 { margin: 0; font: 400 clamp(30px, 9vw, 40px)/1.15 var(--display); letter-spacing: .06em; text-wrap: balance; }
  .menu-noren p { margin: 4px 0 0; font-size: 13px; opacity: .85; }

  .lead { margin: 18px 2px 14px; font-size: 14px; color: var(--ink-soft); }
  .lead b { color: var(--ink); font-weight: 700; }

  /* proposal cards: paper slips pinned under a wooden rail */
  #cards { display: grid; gap: 14px; }
  .card { display: grid; grid-template-columns: 108px 1fr; gap: 12px; align-items: start; width: 100%; text-align: left;
    background: var(--card); border: 2px solid var(--ink); border-radius: 6px; padding: 10px; box-shadow: 0 3px 0 rgba(58,43,34,.18); }
  .card:hover { transform: translateY(-1px); box-shadow: 0 4px 0 rgba(58,43,34,.22); }
  .card:active { transform: translateY(1px); box-shadow: 0 1px 0 rgba(58,43,34,.2); }
  .thumb { border: 1.5px solid var(--ink); border-radius: 4px; display: block; max-width: 100%; }
  .card-text { display: grid; gap: 1px; min-width: 0; }
  .card-no { font: 400 12px/1 var(--display); color: var(--shu); letter-spacing: .08em; }
  .card-title { font: 400 22px/1.25 var(--display); }
  .card-en { font-size: 11px; color: var(--ink-soft); letter-spacing: .04em; }
  .card-pitch { font-size: 13px; line-height: 1.55; margin-top: 4px; }
  .card-progress { display: flex; align-items: center; gap: 4px; margin-top: 6px; }
  .card-progress i { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--ink-soft); }
  .card-progress i.on { background: var(--shu); border-color: var(--shu); }
  .card-progress b { font-size: 11px; color: var(--ink-soft); font-weight: 500; margin-left: 4px; font-variant-numeric: tabular-nums; }

  .card { grid-template-areas: "thumb text" "chips chips"; }
  .card .thumb { grid-area: thumb; }
  .card .card-text { grid-area: text; }
  .chips { grid-area: chips; display: flex; flex-wrap: wrap; gap: 5px; margin: 2px 0 0; padding: 0; list-style: none; }
  .chips li, .chip { font-size: 11.5px; line-height: 1.3; padding: 3px 8px; border-radius: 999px; border: 1.5px dashed var(--ink-soft); color: var(--ink-soft); background: transparent; }
  .chips li.on, .chip.on { border-style: solid; border-color: var(--shu); color: var(--shu); background: #FFF4EC; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin: -4px 2px 14px; }
  .card-no.kept { color: var(--noren); }
  .note { margin-top: 22px; padding: 12px 14px; background: rgba(255,251,242,.7); border: 1.5px dashed var(--ink-soft); border-radius: 6px; font-size: 13px; color: var(--ink-soft); }

  /* play screen */
  .play-noren .panels { height: 76px; }
  .play-noren .noren-text { flex-direction: row; justify-content: space-between; gap: 8px; }
  .tag { flex: none; border: 2px solid var(--ink); background: var(--wood-light); border-radius: 6px 6px 8px 8px; padding: 6px 10px; font: 400 15px/1 var(--display); color: var(--ink); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .tag:disabled { opacity: .45; cursor: default; }
  .tag.dark { background: var(--wood-dark); color: var(--on-noren); }
  .ptitle { min-width: 0; text-align: center; }
  .ptitle h2 { margin: 0; font: 400 22px/1.2 var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ptitle span { font-size: 12px; opacity: .85; font-variant-numeric: tabular-nums; }
  .chalk { flex: none; background: var(--board); color: #F2EEDF; border: 2px solid var(--wood-dark); border-radius: 5px; padding: 3px 8px; text-align: right; min-width: 72px; }
  .chalk b { display: block; font: 400 18px/1.1 var(--display); font-variant-numeric: tabular-nums; }
  .chalk span { font-size: 10.5px; opacity: .8; }
  .rule { display: flex; gap: 8px; align-items: flex-start; margin: 12px 0 6px; }
  .rule-text { flex: 1; display: grid; gap: 6px; min-width: 0; }
  .rule p { margin: 0; font-size: 13px; line-height: 1.6; background: var(--card); border: 1.5px solid var(--ink); border-radius: 6px; padding: 6px 10px; }
  .rule .gnote { background: #FFF1D6; border-color: var(--shu); color: var(--ink); font-weight: 700; }
  .rule button { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--ink); background: var(--card); font: 400 16px/1 var(--display); }
  #stage { display: flex; justify-content: center; padding-block: 6px; }
  #board { touch-action: none; display: block; max-width: 100%; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-top: 6px; }
  .tools .left { display: flex; gap: 8px; }
  #dots { display: flex; gap: 6px; }
  .dot { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--ink-soft); background: var(--card); font-size: 12px; font-variant-numeric: tabular-nums; }
  .dot.on { border-color: var(--shu); color: var(--shu); }
  .dot.cur { background: var(--ink); color: var(--card); border-color: var(--ink); }

  /* receipt */
  #receipt { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; pointer-events: none; }
  .slip { pointer-events: auto; width: 100%; max-width: 420px; background: #FFFBF2; border: 2px solid var(--ink); border-radius: 6px 6px 2px 2px; padding: 14px 16px 16px; box-shadow: 0 -4px 18px rgba(58,43,34,.25); animation: rise .35s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes rise { from { transform: translateY(40px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .slip { animation: none; } }
  .slip h3 { margin: 0; font: 400 26px/1.2 var(--display); color: var(--shu); }
  .slip p { margin: 2px 0 8px; font-size: 13px; color: var(--ink-soft); }
  #r-stars { display: flex; gap: 8px; margin-bottom: 12px; }
  #r-stars i { width: 34px; height: 34px; border-radius: 50%; border: 2px dashed #CDB9A4; display: grid; place-items: center; font: 400 15px/1 var(--display); font-style: normal; color: transparent; }
  #r-stars i.on { border: 2.5px solid var(--shu); color: var(--shu); transform: rotate(-8deg); }
  .slip .row { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }
  .btn { border: 2px solid var(--ink); border-radius: 6px; padding: 9px 10px; background: var(--wood-light); font: 400 16px/1 var(--display); box-shadow: 0 2px 0 rgba(0,0,0,.2); }
  .btn.shu { background: var(--shu); color: #FFF7EA; }
</style>

<main class="wrap">
  <section id="menu">
    <header class="noren menu-noren">
      <div class="panels"><i></i><i></i><i></i></div>
      <div class="noren-text">
        <h1>出前ねこ 次の一皿</h1>
        <p>つみあげ出前のねこが主人公の、次のゲーム案</p>
      </div>
    </header>
    <p class="lead">前回の案から<b>おかもち詰め</b>を残し、<b>しかけを足していける</b>ことを軸に新しい4案を作りました。どの案も4問で、2問目からしかけが1つずつ増えます。全問、解けることと、目標手数が最短であることを確かめてあります。</p>
    <p class="legend"><span class="chip on">モックで遊べるしかけ</span><span class="chip">これから足せるしかけ</span></p>
    <div id="cards"></div>
    <p class="note">進み具合はこの端末のブラウザにだけ保存されます。絵と遊び心地の確認用なので、音はありません。</p>
  </section>

  <section id="play" hidden>
    <header class="noren play-noren">
      <div class="panels"><i></i><i></i><i></i></div>
      <div class="noren-text">
        <button id="back" class="tag" aria-label="案の一覧へ戻る">←</button>
        <div class="ptitle"><h2 id="g-title"></h2><span id="g-level"></span></div>
        <div class="chalk"><b id="g-moves">0手</b><span id="g-par"></span></div>
      </div>
    </header>
    <div class="rule"><div class="rule-text"><p id="g-rule"></p><p id="g-note" class="gnote" hidden></p></div><button id="rule-toggle" aria-label="ルールの表示を切り替える">?</button></div>
    <div id="stage"><canvas id="board" width="1" height="1"></canvas></div>
    <div class="tools">
      <div class="left">
        <button id="undo" class="tag">戻す</button>
        <button id="restart" class="tag dark">やり直す</button>
      </div>
      <div id="dots"></div>
    </div>
  </section>

  <div id="receipt" hidden>
    <div class="slip" role="dialog" aria-labelledby="r-title">
      <h3 id="r-title">毎度あり！</h3>
      <p id="r-body"></p>
      <div id="r-stars"></div>
      <div class="row">
        <button id="r-again" class="btn">もう一度</button>
        <button id="r-next" class="btn shu">次の出前へ</button>
      </div>
    </div>
  </div>
</main>
