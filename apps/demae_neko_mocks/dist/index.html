<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>出前ねこ 次の一皿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
  /* One look on purpose: the washi-and-wood shop of つみあげ出前, in daylight. */
  :root {
    color-scheme: light;
    --paper: #F3EAD8; --paper-deep: #E6D6BA; --card: #FBF5EA; --ink: #3A2B22; --ink-soft: #7D6754;
    --wood: #C6955F; --wood-light: #E0B985; --wood-dark: #7E5535; --noren: #2F4B6B; --on-noren: #F6EEDF;
    --shu: #C8452F; --glow: #FFC56B; --board: #2F3A31;
    --display: "Yusei Magic", "Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif;
    --body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "BIZ UDPGothic", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { background: var(--paper); color: var(--ink); }
  body {
    margin: 0; font-family: var(--body); font-weight: 500; font-size: 15px; line-height: 1.6;
    background-image:
      radial-gradient(rgba(125,103,84,.07) 1px, transparent 1.2px),
      radial-gradient(rgba(125,103,84,.05) 1px, transparent 1.2px);
    background-size: 7px 7px, 11px 11px; background-position: 0 0, 3px 5px;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 0 32px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--glow); outline-offset: 2px; }

  /* noren banner */
  .noren { position: relative; margin-inline: -16px; padding-top: 12px; background: var(--wood-dark); }
  .noren::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 10px; background: #5E3E27; border-bottom: 2px solid var(--ink); }
  .panels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
  .panels i { display: block; height: 100%; background: var(--noren); border-radius: 0 0 5px 5px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }
  .noren-text { position: absolute; inset: 12px 0 0 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--on-noren); text-align: center; padding-inline: 12px; }
  .menu-noren .panels { height: 132px; }
  .menu-noren h1 { margin: 0; font: 400 clamp(30px, 9vw, 40px)/1.15 var(--display); letter-spacing: .06em; text-wrap: balance; }
  .menu-noren p { margin: 4px 0 0; font-size: 13px; opacity: .85; }

  .lead { margin: 18px 2px 14px; font-size: 14px; color: var(--ink-soft); }
  .lead b { color: var(--ink); font-weight: 700; }

  /* proposal cards: paper slips pinned under a wooden rail */
  #cards { display: grid; gap: 14px; }
  .card { display: grid; grid-template-columns: 108px 1fr; gap: 12px; align-items: start; width: 100%; text-align: left;
    background: var(--card); border: 2px solid var(--ink); border-radius: 6px; padding: 10px; box-shadow: 0 3px 0 rgba(58,43,34,.18); }
  .card:hover { transform: translateY(-1px); box-shadow: 0 4px 0 rgba(58,43,34,.22); }
  .card:active { transform: translateY(1px); box-shadow: 0 1px 0 rgba(58,43,34,.2); }
  .thumb { border: 1.5px solid var(--ink); border-radius: 4px; display: block; max-width: 100%; }
  .card-text { display: grid; gap: 1px; min-width: 0; }
  .card-no { font: 400 12px/1 var(--display); color: var(--shu); letter-spacing: .08em; }
  .card-title { font: 400 22px/1.25 var(--display); }
  .card-en { font-size: 11px; color: var(--ink-soft); letter-spacing: .04em; }
  .card-pitch { font-size: 13px; line-height: 1.55; margin-top: 4px; }
  .card-progress { display: flex; align-items: center; gap: 4px; margin-top: 6px; }
  .card-progress i { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--ink-soft); }
  .card-progress i.on { background: var(--shu); border-color: var(--shu); }
  .card-progress b { font-size: 11px; color: var(--ink-soft); font-weight: 500; margin-left: 4px; font-variant-numeric: tabular-nums; }

  .note { margin-top: 22px; padding: 12px 14px; background: rgba(255,251,242,.7); border: 1.5px dashed var(--ink-soft); border-radius: 6px; font-size: 13px; color: var(--ink-soft); }

  /* play screen */
  .play-noren .panels { height: 76px; }
  .play-noren .noren-text { flex-direction: row; justify-content: space-between; gap: 8px; }
  .tag { flex: none; border: 2px solid var(--ink); background: var(--wood-light); border-radius: 6px 6px 8px 8px; padding: 6px 10px; font: 400 15px/1 var(--display); color: var(--ink); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .tag:disabled { opacity: .45; cursor: default; }
  .tag.dark { background: var(--wood-dark); color: var(--on-noren); }
  .ptitle { min-width: 0; text-align: center; }
  .ptitle h2 { margin: 0; font: 400 22px/1.2 var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ptitle span { font-size: 12px; opacity: .85; font-variant-numeric: tabular-nums; }
  .chalk { flex: none; background: var(--board); color: #F2EEDF; border: 2px solid var(--wood-dark); border-radius: 5px; padding: 3px 8px; text-align: right; min-width: 72px; }
  .chalk b { display: block; font: 400 18px/1.1 var(--display); font-variant-numeric: tabular-nums; }
  .chalk span { font-size: 10.5px; opacity: .8; }
  .rule { display: flex; gap: 8px; align-items: flex-start; margin: 12px 0 6px; }
  .rule p { margin: 0; font-size: 13px; line-height: 1.6; background: var(--card); border: 1.5px solid var(--ink); border-radius: 6px; padding: 6px 10px; flex: 1; }
  .rule button { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--ink); background: var(--card); font: 400 16px/1 var(--display); }
  #stage { display: flex; justify-content: center; padding-block: 6px; }
  #board { touch-action: none; display: block; max-width: 100%; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-top: 6px; }
  .tools .left { display: flex; gap: 8px; }
  #dots { display: flex; gap: 6px; }
  .dot { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--ink-soft); background: var(--card); font-size: 12px; font-variant-numeric: tabular-nums; }
  .dot.on { border-color: var(--shu); color: var(--shu); }
  .dot.cur { background: var(--ink); color: var(--card); border-color: var(--ink); }

  /* receipt */
  #receipt { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; pointer-events: none; }
  .slip { pointer-events: auto; width: 100%; max-width: 420px; background: #FFFBF2; border: 2px solid var(--ink); border-radius: 6px 6px 2px 2px; padding: 14px 16px 16px; box-shadow: 0 -4px 18px rgba(58,43,34,.25); animation: rise .35s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes rise { from { transform: translateY(40px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .slip { animation: none; } }
  .slip h3 { margin: 0; font: 400 26px/1.2 var(--display); color: var(--shu); }
  .slip p { margin: 2px 0 8px; font-size: 13px; color: var(--ink-soft); }
  #r-stars { display: flex; gap: 8px; margin-bottom: 12px; }
  #r-stars i { width: 34px; height: 34px; border-radius: 50%; border: 2px dashed #CDB9A4; display: grid; place-items: center; font: 400 15px/1 var(--display); font-style: normal; color: transparent; }
  #r-stars i.on { border: 2.5px solid var(--shu); color: var(--shu); transform: rotate(-8deg); }
  .slip .row { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }
  .btn { border: 2px solid var(--ink); border-radius: 6px; padding: 9px 10px; background: var(--wood-light); font: 400 16px/1 var(--display); box-shadow: 0 2px 0 rgba(0,0,0,.2); }
  .btn.shu { background: var(--shu); color: #FFF7EA; }
</style>

<main class="wrap">
  <section id="menu">
    <header class="noren menu-noren">
      <div class="panels"><i></i><i></i><i></i></div>
      <div class="noren-text">
        <h1>出前ねこ 次の一皿</h1>
        <p>つみあげ出前のねこが主人公の、次のゲーム案</p>
      </div>
    </header>
    <p class="lead">ルールの違う<b>5つの案</b>を、それぞれ4問ずつ遊べるモックにしました。全問、解けること（案2・3・5は答えが1通りなこと）を確かめてあります。気に入った順番を教えてください。</p>
    <div id="cards"></div>
    <p class="note">進み具合はこの端末のブラウザにだけ保存されます。絵と遊び心地の確認用なので、音はありません。</p>
  </section>

  <section id="play" hidden>
    <header class="noren play-noren">
      <div class="panels"><i></i><i></i><i></i></div>
      <div class="noren-text">
        <button id="back" class="tag" aria-label="案の一覧へ戻る">←</button>
        <div class="ptitle"><h2 id="g-title"></h2><span id="g-level"></span></div>
        <div class="chalk"><b id="g-moves">0手</b><span id="g-par"></span></div>
      </div>
    </header>
    <div class="rule"><p id="g-rule"></p><button id="rule-toggle" aria-label="ルールの表示を切り替える">?</button></div>
    <div id="stage"><canvas id="board" width="1" height="1"></canvas></div>
    <div class="tools">
      <div class="left">
        <button id="undo" class="tag">戻す</button>
        <button id="restart" class="tag dark">やり直す</button>
      </div>
      <div id="dots"></div>
    </div>
  </section>

  <div id="receipt" hidden>
    <div class="slip" role="dialog" aria-labelledby="r-title">
      <h3 id="r-title">毎度あり！</h3>
      <p id="r-body"></p>
      <div id="r-stars"></div>
      <div class="row">
        <button id="r-again" class="btn">もう一度</button>
        <button id="r-next" class="btn shu">次の出前へ</button>
      </div>
    </div>
  </div>
</main>

<script>
// Rules for the five mock games, free of any drawing so that node can
// check every level (tool/verify.js) and the page can play them.
(function (root) {
  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  const DIR_LIST = ['up', 'down', 'left', 'right'];

  function bfs(start, key, next, won, limit = 200000) {
    const seen = new Map([[key(start), null]]);
    const queue = [start];
    for (let i = 0; i < queue.length; i++) {
      const s = queue[i];
      if (won(s)) {
        const path = [];
        let k = key(s);
        while (seen.get(k)) {
          const [prev, move] = seen.get(k);
          path.unshift(move);
          k = prev;
        }
        return path;
      }
      if (queue.length > limit) return undefined;
      for (const [move, t] of next(s)) {
        const kt = key(t);
        if (!seen.has(kt)) {
          seen.set(kt, [key(s), move]);
          queue.push(t);
        }
      }
    }
    return null;
  }

  // ---------------------------------------------------------------- 1. slide
  // After the rain the street is slick: the cart slides until something
  // stops it. Sliding into a guest hands over their order. Straw mats stop
  // the cart on them.
  const Slide = {
    parse(map) {
      const h = map.length, w = map[0].length;
      const guests = [];
      let start = null;
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const c = map[y][x];
        if (c === 'P') start = { x, y };
        if (c === 'G') guests.push({ x, y });
      }
      return { w, h, map, guests, start };
    },
    cell(b, x, y) { return x < 0 || y < 0 || x >= b.w || y >= b.h ? '#' : b.map[y][x]; },
    guestAt(b, x, y) { return b.guests.findIndex((g) => g.x === x && g.y === y); },
    init(b) { return { x: b.start.x, y: b.start.y, served: 0 }; },
    // returns { state, path:[{x,y}], served:index|-1 } or null when nothing happens
    move(b, s, dir) {
      const [dx, dy] = DIRS[dir];
      let x = s.x, y = s.y;
      const path = [];
      let hit = -1;
      for (;;) {
        const nx = x + dx, ny = y + dy;
        const g = Slide.guestAt(b, nx, ny);
        if (g >= 0) { hit = g; break; }
        if (Slide.cell(b, nx, ny) === '#') break;
        x = nx; y = ny;
        path.push({ x, y });
        if (Slide.cell(b, x, y) === 'o') break;
      }
      const newServe = hit >= 0 && !(s.served & (1 << hit));
      if (!path.length && !newServe) return null;
      return { state: { x, y, served: newServe ? s.served | (1 << hit) : s.served }, path, served: newServe ? hit : -1 };
    },
    won(b, s) { return s.served === (1 << b.guests.length) - 1; },
    solve(b) {
      return bfs(Slide.init(b), (s) => `${s.x},${s.y},${s.served}`,
        (s) => DIR_LIST.map((d) => [d, Slide.move(b, s, d)]).filter(([, r]) => r).map(([d, r]) => [d, r.state]),
        (s) => Slide.won(b, s));
    },
  };

  // ---------------------------------------------------------------- 2. pack
  // Fill the okamochi (the delivery box) with every dish. Hot and cold
  // dishes may not touch; soups have to sit on the bottom shelf.
  function norm(cells) {
    const mx = Math.min(...cells.map((c) => c[0])), my = Math.min(...cells.map((c) => c[1]));
    return cells.map(([x, y]) => [x - mx, y - my]).sort((a, b) => a[1] - b[1] || a[0] - b[0]);
  }
  function rotations(cells) {
    const out = [];
    let cur = norm(cells);
    for (let i = 0; i < 4; i++) {
      const k = JSON.stringify(cur);
      if (!out.some((o) => JSON.stringify(o) === k)) out.push(cur);
      cur = norm(cur.map(([x, y]) => [-y, x]));
    }
    return out;
  }
  const Pack = {
    // level: { box: ['....', ...] ('#' = no shelf), pieces: [{ cells:[[x,y]...], kind:'hot'|'cold'|'plain', soup?:bool, food }] }
    rotations,
    rotate(cells) { return norm(cells.map(([x, y]) => [-y, x])); },
    norm,
    free(level) {
      const out = [];
      level.box.forEach((row, y) => [...row].forEach((c, x) => { if (c !== '#') out.push([x, y]); }));
      return out;
    },
    // placed: [{ piece:i, x, y, cells(rotated, normalised) }]
    grid(level, placed) {
      const h = level.box.length, w = level.box[0].length;
      const g = Array.from({ length: h }, () => Array(w).fill(-1));
      for (const p of placed) for (const [cx, cy] of p.cells) g[p.y + cy][p.x + cx] = p.piece;
      return g;
    },
    canPlace(level, placed, piece, cells, x, y) {
      const h = level.box.length, w = level.box[0].length;
      const g = Pack.grid(level, placed);
      for (const [cx, cy] of cells) {
        const gx = x + cx, gy = y + cy;
        if (gx < 0 || gy < 0 || gx >= w || gy >= h) return false;
        if (level.box[gy][gx] === '#' || g[gy][gx] >= 0) return false;
      }
      return true;
    },
    // rule breaks in a (partial) packing: pairs of touching hot/cold pieces
    // and soups off the bottom shelf
    problems(level, placed) {
      const g = Pack.grid(level, placed);
      const h = g.length, w = g[0].length;
      const clash = new Set();
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const a = g[y][x];
        if (a < 0) continue;
        for (const [dx, dy] of [[1, 0], [0, 1]]) {
          const bx = x + dx, by = y + dy;
          if (bx >= w || by >= h) continue;
          const b = g[by][bx];
          if (b < 0 || b === a) continue;
          const ka = level.pieces[a].kind, kb = level.pieces[b].kind;
          if ((ka === 'hot' && kb === 'cold') || (ka === 'cold' && kb === 'hot')) { clash.add(a); clash.add(b); }
        }
      }
      const floating = new Set();
      for (const p of placed) {
        if (!level.pieces[p.piece].soup) continue;
        // the bottom shelf is the lowest open row in that column
        const ok = p.cells.some(([cx, cy]) => {
          const x = p.x + cx, y = p.y + cy;
          for (let yy = y + 1; yy < h; yy++) if (level.box[yy][x] !== '#') return false;
          return true;
        });
        if (!ok) floating.add(p.piece);
      }
      return { clash, floating };
    },
    won(level, placed) {
      if (placed.length !== level.pieces.length) return false;
      const pr = Pack.problems(level, placed);
      return pr.clash.size === 0 && pr.floating.size === 0;
    },
    // number of valid packings (capped), for checking a level has exactly one
    count(level, cap = 2) {
      const h = level.box.length, w = level.box[0].length;
      const rots = level.pieces.map((p) => rotations(p.cells));
      const used = Array(level.pieces.length).fill(false);
      const placed = [];
      let n = 0;
      const g = Array.from({ length: h }, (_, y) => Array.from({ length: w }, (_, x) => (level.box[y][x] === '#' ? -2 : -1)));
      const rec = () => {
        if (n >= cap) return;
        let fx = -1, fy = -1;
        outer: for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (g[y][x] === -1) { fx = x; fy = y; break outer; }
        if (fx < 0) {
          if (Pack.won(level, placed)) n++;
          return;
        }
        const tried = new Set();
        for (let i = 0; i < level.pieces.length; i++) {
          if (used[i]) continue;
          const sig = JSON.stringify([level.pieces[i].kind, !!level.pieces[i].soup, rots[i].map((r) => JSON.stringify(r)).sort()[0]]);
          if (tried.has(sig)) continue; // identical pieces: try once
          tried.add(sig);
          for (const r of rots[i]) {
            const [ax, ay] = r[0];
            const ox = fx - ax, oy = fy - ay;
            if (!r.every(([cx, cy]) => { const x = ox + cx, y = oy + cy; return x >= 0 && y >= 0 && x < w && y < h && g[y][x] === -1; })) continue;
            r.forEach(([cx, cy]) => { g[oy + cy][ox + cx] = i; });
            used[i] = true;
            placed.push({ piece: i, x: ox, y: oy, cells: r });
            const pr = Pack.problems(level, placed);
            if (pr.clash.size === 0) rec();
            placed.pop();
            used[i] = false;
            r.forEach(([cx, cy]) => { g[oy + cy][ox + cx] = -1; });
          }
        }
      };
      rec();
      return n;
    },
  };

  // --------------------------------------------------------------- 3. stroke
  // One round of the neighbourhood: walk every lane exactly once, calling at
  // the numbered houses in order.
  const Stroke = {
    parse(map) {
      const h = map.length, w = map[0].length;
      const nums = {};
      let open = 0;
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const c = map[y][x];
        if (c !== '#') open++;
        if (/[0-9a-z]/.test(c) && c !== '.') nums[`${x},${y}`] = parseInt(c, 36);
      }
      const last = Math.max(...Object.values(nums));
      const start = Object.entries(nums).find(([, v]) => v === 1)[0].split(',').map(Number);
      return { w, h, map, nums, last, open, start: { x: start[0], y: start[1] } };
    },
    open(b, x, y) { return x >= 0 && y >= 0 && x < b.w && y < b.h && b.map[y][x] !== '#'; },
    // can the path (list of {x,y}) be extended to (x,y)?
    canStep(b, path, x, y) {
      const t = path[path.length - 1];
      if (Math.abs(t.x - x) + Math.abs(t.y - y) !== 1 || !Stroke.open(b, x, y)) return false;
      if (path.some((p) => p.x === x && p.y === y)) return false;
      const n = b.nums[`${x},${y}`];
      if (n === undefined) return true;
      return n === Stroke.nextNumber(b, path);
    },
    nextNumber(b, path) {
      let k = 1;
      for (const p of path) { const n = b.nums[`${p.x},${p.y}`]; if (n !== undefined) k = n + 1; }
      return k;
    },
    won(b, path) {
      const t = path[path.length - 1];
      return path.length === b.open && b.nums[`${t.x},${t.y}`] === b.last;
    },
    count(b, cap = 2) {
      let n = 0;
      const path = [b.start];
      const seen = new Set([`${b.start.x},${b.start.y}`]);
      const rec = () => {
        if (n >= cap) return;
        if (Stroke.won(b, path)) { n++; return; }
        const t = path[path.length - 1];
        for (const [dx, dy] of Object.values(DIRS)) {
          const x = t.x + dx, y = t.y + dy, k = `${x},${y}`;
          if (seen.has(k) || !Stroke.canStep(b, path, x, y)) continue;
          seen.add(k); path.push({ x, y });
          rec();
          path.pop(); seen.delete(k);
        }
      };
      rec();
      return n;
    },
  };

  // ----------------------------------------------------------------- 4. sort
  // Stall counters with mixed plates. Carry the top plate to another
  // counter (empty, or with the same dish on top) until every counter holds
  // one dish only.
  const Sort = {
    init(level) { return level.stacks.map((s) => [...s]); },
    canMove(level, st, i, j) {
      if (i === j || !st[i].length || st[j].length >= level.cap) return false;
      return !st[j].length || st[j][st[j].length - 1] === st[i][st[i].length - 1];
    },
    move(level, st, i, j) {
      if (!Sort.canMove(level, st, i, j)) return null;
      const n = st.map((s) => [...s]);
      n[j].push(n[i].pop());
      return n;
    },
    won(level, st) {
      return st.every((s) => !s.length || (s.length === level.cap && s.every((d) => d === s[0])));

          E(x - r * 0.3, y - r * 0.12, r * 0.1, r * 0.06, '#E8E2C8', 0);
          E(x + r * 0.2, y - r * 0.05, r * 0.1, r * 0.06, '#6E9C58', 0);
        }
        break;
      }
      case 'soba': {
        Art.rr(ctx, x - r, y - r * 0.2, r * 2, r * 0.8, r * 0.2);
        Art.inked(ctx, '#C9A26A', lw);
        E(x, y - r * 0.1, r * 0.75, r * 0.4, '#8C7A68', lw);
        ctx.strokeStyle = '#6A5A4A'; ctx.lineWidth = lw * 0.6;
        for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(x - r * 0.5, y - r * 0.1 + i * r * 0.12); ctx.quadraticCurveTo(x, y + i * r * 0.12, x + r * 0.5, y - r * 0.1 + i * r * 0.12); ctx.stroke(); }
        break;
      }
      case 'sushi': {
        for (const s of [-1, 1]) {
          Art.rr(ctx, x + s * r * 0.5 - r * 0.42, y - r * 0.1, r * 0.84, r * 0.55, r * 0.2);
          Art.inked(ctx, '#FFFDF6', lw);
          Art.rr(ctx, x + s * r * 0.5 - r * 0.48, y - r * 0.42, r * 0.96, r * 0.4, r * 0.18);
          Art.inked(ctx, s < 0 ? '#F08A5D' : '#D8433A', lw);
        }
        break;
      }
      case 'tamago': {
        Art.rr(ctx, x - r * 0.8, y - r * 0.45, r * 1.6, r * 0.9, r * 0.15);
        Art.inked(ctx, '#F4CF4A', lw);
        ctx.fillStyle = '#2F3B2F';
        ctx.fillRect(x - r * 0.15, y - r * 0.45, r * 0.3, r * 0.9);
        break;
      }
      case 'onigiri': {
        ctx.beginPath();
        ctx.moveTo(x, y - r * 0.85);
        ctx.quadraticCurveTo(x + r * 0.2, y - r * 0.85, x + r * 0.85, y + r * 0.45);
        ctx.quadraticCurveTo(x + r * 0.9, y + r * 0.7, x + r * 0.6, y + r * 0.7);
        ctx.lineTo(x - r * 0.6, y + r * 0.7);
        ctx.quadraticCurveTo(x - r * 0.9, y + r * 0.7, x - r * 0.85, y + r * 0.45);
        ctx.quadraticCurveTo(x - r * 0.2, y - r * 0.85, x, y - r * 0.85);
        Art.inked(ctx, '#FFFDF6', lw);
        ctx.fillStyle = '#2F3B2F';
        ctx.fillRect(x - r * 0.4, y + r * 0.2, r * 0.8, r * 0.5);
        break;
      }
      case 'gyoza': {
        for (const s of [-1, 0, 1]) {
          ctx.beginPath();
          ctx.ellipse(x + s * r * 0.55, y, r * 0.32, r * 0.55, s * 0.2, 0, Math.PI * 2);
          Art.inked(ctx, '#F2D8A8', lw);
          ctx.beginPath();
          ctx.moveTo(x + s * r * 0.55 - r * 0.2, y + r * 0.35);
          ctx.lineTo(x + s * r * 0.55 + r * 0.2, y + r * 0.35);
          ctx.strokeStyle = '#C98A45'; ctx.lineWidth = lw * 1.4; ctx.stroke();
        }
        break;
      }
      case 'tempura': {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(-0.5);
        E(0, 0, r * 0.95, r * 0.36, '#EDB654');
        ctx.beginPath(); ctx.moveTo(r * 0.9, 0); ctx.lineTo(r * 1.2, -r * 0.25); ctx.lineTo(r * 1.2, r * 0.25); ctx.closePath();
        Art.inked(ctx, '#E0553B', lw);
        ctx.restore();
        break;
      }
      case 'purin': {
        ctx.beginPath();
        ctx.moveTo(x - r * 0.5, y - r * 0.5);
        ctx.lineTo(x + r * 0.5, y - r * 0.5);
        ctx.lineTo(x + r * 0.75, y + r * 0.55);
        ctx.lineTo(x - r * 0.75, y + r * 0.55);
        ctx.closePath();
        Art.inked(ctx, '#F6D77A', lw);
        E(x, y - r * 0.52, r * 0.5, r * 0.16, '#8A4E22', lw);
        break;
      }
      case 'salad': {
        E(x, y + r * 0.1, r, r * 0.55, '#DDEFF6', lw);
        for (const [dx, dy, c] of [[-0.4, -0.1, '#7FB069'], [0.1, -0.2, '#5E9A4C'], [0.45, 0, '#D8433A'], [-0.05, 0.1, '#9CCB7A']]) E(x + dx * r, y + dy * r, r * 0.3, r * 0.2, c, lw * 0.6);
        break;
      }
      case 'dango': {
        ctx.strokeStyle = '#A8845A'; ctx.lineWidth = lw * 1.2;
        ctx.beginPath(); ctx.moveTo(x - r, y + r * 0.6); ctx.lineTo(x + r, y - r * 0.6); ctx.stroke();
        [['#F2B8C6', -0.5], ['#FFFDF6', 0], ['#8CBF6A', 0.5]].forEach(([c, k]) => E(x + k * r * 1.1, y - k * r * 0.66, r * 0.33, r * 0.33, c));
        break;
      }
      case 'bento': {
        Art.rr(ctx, x - r, y - r * 0.7, r * 2, r * 1.4, r * 0.18);
        Art.inked(ctx, '#2B2B2B', lw);
        Art.rr(ctx, x - r * 0.85, y - r * 0.55, r * 0.95, r * 1.1, r * 0.1);
        Art.inked(ctx, '#FFFDF6', lw * 0.6);
        E(x - r * 0.38, y, r * 0.14, r * 0.14, '#D8433A', 0);
        E(x + r * 0.5, y - r * 0.2, r * 0.3, r * 0.2, '#F4CF4A', lw * 0.6);
        E(x + r * 0.5, y + r * 0.3, r * 0.3, r * 0.2, '#7FB069', lw * 0.6);
        break;
      }
      default: E(x, y, r * 0.7, r * 0.7, '#ddd');
    }
  },
};

const FOOD_NAME = {
  ramen: 'ラーメン', soba: 'ざるそば', sushi: 'お寿司', tamago: '卵焼き', onigiri: 'おにぎり', gyoza: '餃子',
  miso: 'みそ汁', tempura: '天ぷら', purin: 'プリン', salad: 'サラダ', dango: 'だんご', bento: 'お弁当',
};

// A seeded wobble for hand-drawn lines.
function wob(i, j, k = 0) {
  const s = Math.sin(i * 127.1 + j * 311.7 + k * 74.7) * 43758.5453;
  return s - Math.floor(s) - 0.5;
}

// The five mock games. Each one draws into a canvas of the width it is
// given and handles pointer input in canvas pixels (CSS px).
const { Slide, Pack, Stroke, Sort, Deduce } = Logic;
const ease = (p) => 1 - Math.pow(1 - Math.min(1, Math.max(0, p)), 3);
const now = () => performance.now() / 1000;

function paperTile(ctx, x, y, w, h, fill) {
  ctx.fillStyle = fill;
  ctx.fillRect(x, y, w, h);
}

// ======================================================================
// 1. すべって出前 — slide until something stops you
// ======================================================================
class SlideGame {
  constructor(level, api) {
    this.api = api;
    this.level = level;
    this.b = Slide.parse(level.map);
    this.s = Slide.init(this.b);
    this.hist = [];
    this.moves = 0;
    this.anim = null;
    this.facing = 'down';
    this.foods = ['ramen', 'sushi', 'tamago', 'gyoza', 'soba'];
    this.servedAt = {};
  }
  layout(w) {
    this.cell = Math.floor(Math.min(w / this.b.w, 64));
    this.ox = Math.floor((w - this.cell * this.b.w) / 2);
    this.oy = 6;
    return this.cell * this.b.h + 12;
  }
  status() { return { moves: this.moves, par: this.level.par }; }
  canUndo() { return this.hist.length > 0 && !this.anim; }
  undo() {
    if (!this.canUndo()) return;
    this.s = this.hist.pop();
    this.moves--;
  }
  go(dir) {
    if (this.anim || Slide.won(this.b, this.s)) return;
    const r = Slide.move(this.b, this.s, dir);
    this.facing = dir;
    if (!r) { this.bump = { dir, t: now() }; return; }
    this.hist.push(this.s);
    this.anim = { from: this.s, r, t0: now(), dur: 0.09 * Math.max(1, r.path.length) + 0.05 };
    this.moves++;
  }
  down(x, y) { this.p0 = { x, y }; }
  up(x, y) {
    if (!this.p0) return;
    let dx = x - this.p0.x, dy = y - this.p0.y;
    if (Math.hypot(dx, dy) < 14) {
      // a tap: go towards it from the cat
      const c = this.cellCenter(this.s.x, this.s.y);
      dx = x - c.x; dy = y - c.y;
      if (Math.hypot(dx, dy) < this.cell * 0.4) { this.p0 = null; return; }
    }
    this.go(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    this.p0 = null;
  }
  key(k) {
    const m = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' }[k];
    if (m) this.go(m);
  }
  cellCenter(x, y) { return { x: this.ox + (x + 0.5) * this.cell, y: this.oy + (y + 0.5) * this.cell }; }
  draw(ctx, t) {
    const { b, cell: u } = this;
    // finish the slide
    let pos = { x: this.s.x, y: this.s.y };
    let served = this.s.served;
    if (this.anim) {
      const a = this.anim;
      const p = (now() - a.t0) / a.dur;
      if (p >= 1) {
        this.s = a.r.state;
        if (a.r.served >= 0) this.servedAt[a.r.served] = now();
        this.anim = null;
        pos = { x: this.s.x, y: this.s.y };
        served = this.s.served;
        if (Slide.won(b, this.s)) setTimeout(() => this.api.won(this.status()), 600);
      } else {
        const pts = [{ x: a.from.x, y: a.from.y }, ...a.r.path];
        const q = ease(p) * (pts.length - 1);
        const i = Math.min(pts.length - 2, Math.floor(q));
        const f = q - i;
        pos = pts.length > 1 ? { x: pts[i].x + (pts[i + 1].x - pts[i].x) * f, y: pts[i].y + (pts[i + 1].y - pts[i].y) * f } : pts[0];
        served = a.from.served;
      }
    }
    // floor: wet paving stones
    for (let y = 0; y < b.h; y++) for (let x = 0; x < b.w; x++) {
      const c = b.map[y][x];
      const X = this.ox + x * u, Y = this.oy + y * u;
      if (c === '#') continue;
      paperTile(ctx, X, Y, u + 0.5, u + 0.5, (x + y) % 2 ? '#DCD6CA' : '#D3CDC0');
      ctx.strokeStyle = 'rgba(58,43,34,.18)';
      ctx.lineWidth = 1;
      ctx.strokeRect(X + 0.5, Y + 0.5, u - 1, u - 1);
      // a sheen of rain water
      ctx.strokeStyle = 'rgba(255,255,255,.55)';
      ctx.lineWidth = Math.max(1, u * 0.04);
      ctx.beginPath();
      const k = wob(x, y) * u * 0.3;
      ctx.moveTo(X + u * 0.2 + k, Y + u * 0.7);
      ctx.lineTo(X + u * 0.45 + k, Y + u * 0.62);
      ctx.stroke();
      if (c === 'o') {
        Art.rr(ctx, X + u * 0.08, Y + u * 0.08, u * 0.84, u * 0.84, u * 0.08);
        Art.inked(ctx, '#D8B96E', Math.max(1, u * 0.035));
        ctx.strokeStyle = 'rgba(122,90,40,.45)';
        ctx.lineWidth = Math.max(1, u * 0.025);
        for (let i = 1; i < 6; i++) {
          ctx.beginPath();
          ctx.moveTo(X + u * 0.1, Y + u * (0.08 + i * 0.14));
          ctx.lineTo(X + u * 0.9, Y + u * (0.08 + i * 0.14));
          ctx.stroke();
        }
      }
    }
    // walls: wooden crates and shop fronts, seen from above
    for (let y = 0; y < b.h; y++) for (let x = 0; x < b.w; x++) {
      if (b.map[y][x] !== '#') continue;
      const X = this.ox + x * u, Y = this.oy + y * u;
      const edge = x === 0 || y === 0 || x === b.w - 1 || y === b.h - 1;
      paperTile(ctx, X, Y, u + 0.5, u + 0.5, edge ? '#8C6B50' : '#B98A5E');
      if (!edge) {
        Art.rr(ctx, X + u * 0.1, Y + u * 0.1, u * 0.8, u * 0.8, u * 0.06);
        Art.inked(ctx, '#C9995F', Math.max(1, u * 0.04));
        ctx.beginPath();
        ctx.moveTo(X + u * 0.1, Y + u * 0.1); ctx.lineTo(X + u * 0.9, Y + u * 0.9);
        ctx.moveTo(X + u * 0.9, Y + u * 0.1); ctx.lineTo(X + u * 0.1, Y + u * 0.9);
        ctx.stroke();
      } else {
        ctx.fillStyle = 'rgba(0,0,0,.08)';
        if ((x + y) % 2) ctx.fillRect(X, Y, u, u);
      }
    }
    // guests
    b.guests.forEach((g, i) => {
      const c = this.cellCenter(g.x, g.y);
      const done = !!(served & (1 << i));
      Art.guest(ctx, c.x, c.y - u * 0.05, u * 0.3, i, { happy: done, t });
      Art.ticket(ctx, c.x + u * 0.3, c.y - u * 0.34, u * 0.34, this.foods[i], { done });
    });
    // cat
    const c = this.cellCenter(pos.x, pos.y);
    let bx = 0, by = 0;
    if (this.bump && now() - this.bump.t < 0.25) {
      const d = Logic.DIRS[this.bump.dir];
      const k = Math.sin((now() - this.bump.t) / 0.25 * Math.PI) * u * 0.08;
      bx = d[0] * k; by = d[1] * k;
    }
    const left = b.guests.filter((_, i) => !(served & (1 << i))).length;
    const carry = this.foods.slice(0, b.guests.length).filter((_, i) => !(served & (1 << i))).slice(0, 3);
    Art.cat(ctx, c.x + bx, c.y - u * 0.18 + by, u * 0.24, { facing: this.facing, t, carry: left ? carry : [], happy: !left });
    // flying dish to a just-served guest
    for (const [i, t0] of Object.entries(this.servedAt)) {
      const q = (now() - t0) / 0.5;
      if (q > 1) continue;
      const g = b.guests[i];
      const to = this.cellCenter(g.x, g.y);
      Art.plate(ctx, c.x + (to.x - c.x) * ease(q), c.y - u * 0.5 + (to.y - c.y) * ease(q) - Math.sin(q * Math.PI) * u * 0.4, u * 0.3, this.foods[i]);
    }
  }
}

// ======================================================================
// 2. おかもち詰め — pack the delivery box
// ======================================================================
class PackGame {
  constructor(level, api) {
    this.api = api;
    this.level = level;
    this.rot = level.pieces.map((p) => p.cells);
    this.placed = [];
    this.hist = [];
    this.moves = 0;
    this.drag = null;
    this.problemAt = 0;
  }
  layout(w) {
    const L = this.level;
    const bw = L.box[0].length, bh = L.box.length;
    this.cell = Math.floor(Math.min((w - 40) / bw, 58));
    this.bx = Math.floor((w - this.cell * bw) / 2);
    this.by = 16;
    this.w = w;
    // tray below, pieces laid out left to right in rows, each in a slot
    // big enough for any turn of it
    this.tc = Math.floor(this.cell * 0.72);
    let x = 12, y = this.by + this.cell * bh + 40, rowH = 0;
    this.trayTop = y - 16;
    this.slots = this.level.pieces.map((p) => {
      const ext = Math.max(...p.cells.map((c) => Math.max(c[0], c[1]))) + 1;
      const box = ext * this.tc + 8;
      if (x + box > w - 8) { x = 12; y += rowH + 10; rowH = 0; }
      const slot = { x, y, w: box, h: box };
      x += box + 10;
      rowH = Math.max(rowH, box);
      return slot;
    });
    return y + rowH + 18;
  }
  status() { return { moves: this.moves, par: this.level.pieces.length, label: `${this.placed.length}/${this.level.pieces.length}品` }; }
  canUndo() { return this.hist.length > 0; }
  undo() {
    if (!this.hist.length) return;
    const h = this.hist.pop();
    this.placed = h.placed;
    this.rot = h.rot;
    this.moves--;
  }
  snapshot() { this.hist.push({ placed: this.placed.map((p) => ({ ...p })), rot: [...this.rot] }); }
  inTray(i) { return !this.placed.some((p) => p.piece === i); }
  pieceAtBox(x, y) {
    const gx = Math.floor((x - this.bx) / this.cell), gy = Math.floor((y - this.by) / this.cell);
    return this.placed.find((p) => p.cells.some(([cx, cy]) => p.x + cx === gx && p.y + cy === gy));
  }
  down(x, y) {
    const onBox = this.pieceAtBox(x, y);
    if (onBox) {
      this.drag = { piece: onBox.piece, from: 'box', cells: onBox.cells, x, y, x0: x, y0: y, src: onBox };
      return;
    }
    const i = this.slots.findIndex((s, k) => this.inTray(k) && x >= s.x && x <= s.x + s.w && y >= s.y && y <= s.y + s.h);
    if (i >= 0) this.drag = { piece: i, from: 'tray', cells: this.rot[i], x, y, x0: x, y0: y };
  }
  move(x, y) { if (this.drag) { this.drag.x = x; this.drag.y = y; } }
  up(x, y) {
    const d = this.drag;
    this.drag = null;
    if (!d) return;
    const tap = Math.hypot(x - d.x0, y - d.y0) < 8;
    const others = this.placed.filter((p) => p.piece !== d.piece);
    if (tap) {
      // tap turns the dish
      const r = Pack.rotate(d.cells);
      this.snapshot();
      if (d.from === 'tray') { this.rot[d.piece] = r; this.hist.pop(); return; }
      if (Pack.canPlace(this.level, others, d.piece, r, d.src.x, d.src.y)) {
        this.placed = [...others, { piece: d.piece, x: d.src.x, y: d.src.y, cells: r }];
      } else {
        this.placed = others;
        this.rot[d.piece] = r;
      }
      this.after();
      return;
    }
    // drop where the dragged dish's top-left cell lands
    const g = this.ghost(d);
    const gx = Math.round((g.x - this.bx) / this.cell), gy = Math.round((g.y - this.by) / this.cell);
    this.snapshot();
    if (Pack.canPlace(this.level, others, d.piece, d.cells, gx, gy)) {
      this.placed = [...others, { piece: d.piece, x: gx, y: gy, cells: d.cells }];
      this.moves++;
    } else {
      this.placed = others;
      this.rot[d.piece] = d.cells;
      if (d.from === 'tray') this.hist.pop();
    }
    this.after();
  }
  after() {
    const pr = Pack.problems(this.level, this.placed);
    if (pr.clash.size || pr.floating.size) this.problemAt = now();
    if (Pack.won(this.level, this.placed)) setTimeout(() => this.api.won(this.status()), 500);
  }
  // top-left of a dragged dish, drawn at box scale under the finger
  ghost(d) {
    const u = this.cell;
    const w = Math.max(...d.cells.map((c) => c[0])) + 1, h = Math.max(...d.cells.map((c) => c[1])) + 1;
    return { x: d.x - (w * u) / 2, y: d.y - (h * u) / 2 - u * 0.6, u };
  }
  drawPiece(ctx, i, cells, ox, oy, u, o = {}) {
    const p = this.level.pieces[i];
    const fill = { hot: '#F7CBAE', cold: '#CFE4F2', plain: '#F4E7C9' }[p.kind];
    const lw = Math.max(1.2, u * 0.05);
    const set = new Set(cells.map(([x, y]) => `${x},${y}`));
    ctx.save();
    if (o.alpha) ctx.globalAlpha = o.alpha;
    for (const [cx, cy] of cells) paperTile(ctx, ox + cx * u, oy + cy * u, u + 0.5, u + 0.5, fill);
    // texture: steam for hot, frost for cold
    for (const [cx, cy] of cells) {
      const X = ox + cx * u, Y = oy + cy * u;
      ctx.strokeStyle = p.kind === 'hot' ? 'rgba(200,69,47,.35)' : p.kind === 'cold' ? 'rgba(60,120,170,.35)' : 'rgba(125,103,84,.18)';
      ctx.lineWidth = Math.max(1, u * 0.035);
      ctx.beginPath();
      if (p.kind === 'hot') {
        for (const k of [0.3, 0.7]) { ctx.moveTo(X + u * k, Y + u * 0.8); ctx.bezierCurveTo(X + u * (k - 0.1), Y + u * 0.6, X + u * (k + 0.1), Y + u * 0.4, X + u * k, Y + u * 0.2); }
      } else if (p.kind === 'cold') {
        for (const [a, b2] of [[0.25, 0.25], [0.75, 0.7]]) { const r = u * 0.08; ctx.moveTo(X + u * a - r, Y + u * b2); ctx.lineTo(X + u * a + r, Y + u * b2); ctx.moveTo(X + u * a, Y + u * b2 - r); ctx.lineTo(X + u * a, Y + u * b2 + r); }
      }
      ctx.stroke();
    }
    // outline only the outer edges, so one dish reads as one shape
    ctx.strokeStyle = o.warn ? C.shu : C.ink;
    ctx.lineWidth = o.warn ? lw * 2 : lw;
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (const [cx, cy] of cells) {
      const X = ox + cx * u, Y = oy + cy * u;
      if (!set.has(`${cx},${cy - 1}`)) { ctx.moveTo(X, Y); ctx.lineTo(X + u, Y); }
      if (!set.has(`${cx},${cy + 1}`)) { ctx.moveTo(X, Y + u); ctx.lineTo(X + u, Y + u); }
      if (!set.has(`${cx - 1},${cy}`)) { ctx.moveTo(X, Y); ctx.lineTo(X, Y + u); }
      if (!set.has(`${cx + 1},${cy}`)) { ctx.moveTo(X + u, Y); ctx.lineTo(X + u, Y + u); }
    }
    ctx.stroke();
    // the dish on the cell nearest the middle
    const mx = cells.reduce((s, c) => s + c[0], 0) / cells.length, my = cells.reduce((s, c) => s + c[1], 0) / cells.length;
    const [fx, fy] = cells.slice().sort((a, b) => Math.hypot(a[0] - mx, a[1] - my) - Math.hypot(b[0] - mx, b[1] - my))[0];
    Art.food(ctx, p.food, ox + (fx + 0.5) * u, oy + (fy + 0.5) * u, u * 0.3);
    if (p.soup) {
      // soups show a little arrow pointing to the floor of the box
      const X = ox + (fx + 0.5) * u, Y = oy + (fy + 0.92) * u;
      ctx.fillStyle = o.floating ? C.shu : C.inkSoft;
      ctx.beginPath(); ctx.moveTo(X - u * 0.1, Y - u * 0.1); ctx.lineTo(X + u * 0.1, Y - u * 0.1); ctx.lineTo(X, Y); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  draw(ctx, t) {
    const L = this.level, u = this.cell;
    const bw = L.box[0].length, bh = L.box.length;
    // the okamochi: lacquered box with a brass handle
    const X = this.bx, Y = this.by;
    ctx.fillStyle = '#6E2A20';
    Art.rr(ctx, X - 12, Y - 10, bw * u + 24, bh * u + 22, 8);
    Art.inked(ctx, '#7A3024', 2);
    ctx.strokeStyle = '#B08A45';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(X + bw * u * 0.3, Y - 10); ctx.lineTo(X + bw * u * 0.3, Y - 16); ctx.lineTo(X + bw * u * 0.7, Y - 16); ctx.lineTo(X + bw * u * 0.7, Y - 10);
    ctx.stroke();
    for (let y = 0; y < bh; y++) for (let x = 0; x < bw; x++) {
      const cx = X + x * u, cy = Y + y * u;
      if (L.box[y][x] === '#') {
        paperTile(ctx, cx, cy, u + 0.5, u + 0.5, '#5C241B');
        continue;
      }
      paperTile(ctx, cx, cy, u + 0.5, u + 0.5, '#EADAB9');
      ctx.strokeStyle = 'rgba(58,43,34,.2)';
      ctx.lineWidth = 1;
      ctx.strokeRect(cx + 0.5, cy + 0.5, u - 1, u - 1);
    }
    // shelf boards between rows
    for (let y = 1; y < bh; y++) {
      ctx.fillStyle = 'rgba(110,42,32,.35)';
      ctx.fillRect(X, Y + y * u - 1.5, bw * u, 3);
    }
    const pr = Pack.problems(L, this.placed);
    const shake = now() - this.problemAt < 0.4 ? Math.sin((now() - this.problemAt) * 50) * 2 : 0;
    for (const p of this.placed) {
      if (this.drag && this.drag.piece === p.piece) continue;
      const warn = pr.clash.has(p.piece);
      this.drawPiece(ctx, p.piece, p.cells, X + p.x * u + (warn ? shake : 0), Y + p.y * u, u, { warn, floating: pr.floating.has(p.piece) });
    }
    // tray
    Art.rr(ctx, 6, this.trayTop, this.w - 12, 8, 3);
    Art.inked(ctx, C.woodDark, 1.5);
    this.slots.forEach((s, i) => {
      if (!this.inTray(i) || (this.drag && this.drag.piece === i)) return;
      const cells = this.rot[i];
      const w = Math.max(...cells.map((c) => c[0])) + 1, h = Math.max(...cells.map((c) => c[1])) + 1;
      this.drawPiece(ctx, i, cells, s.x + (s.w - w * this.tc) / 2, s.y + (s.h - h * this.tc) / 2, this.tc);
    });
    // the dish being dragged, at box scale
    if (this.drag && Math.hypot(this.drag.x - this.drag.x0, this.drag.y - this.drag.y0) >= 8) {
      const g = this.ghost(this.drag);
      const gx = Math.round((g.x - this.bx) / u), gy = Math.round((g.y - this.by) / u);
      const others = this.placed.filter((p) => p.piece !== this.drag.piece);
      if (Pack.canPlace(L, others, this.drag.piece, this.drag.cells, gx, gy)) {
        ctx.fillStyle = 'rgba(255,197,107,.35)';
        for (const [cx, cy] of this.drag.cells) ctx.fillRect(X + (gx + cx) * u, Y + (gy + cy) * u, u, u);
      }
      this.drawPiece(ctx, this.drag.piece, this.drag.cells, g.x, g.y, u, { alpha: 0.9 });
    }
    // the cat waits beside the box with the lid
    Art.cat(ctx, Math.max(28, X - 34), Y + bh * u - 22, 16, { facing: 'right', t, noShadow: false });
  }
}

// ======================================================================
// 3. ひとふで出前 — one round through every lane
// ======================================================================
class StrokeGame {
  constructor(level, api) {
    this.api = api;
    this.level = level;
    this.b = Stroke.parse(level.map);
    this.path = [this.b.start];
    this.hist = [];
    this.moves = 0;
  }
  layout(w) {
    this.cell = Math.floor(Math.min(w / this.b.w, 70));
    this.ox = Math.floor((w - this.cell * this.b.w) / 2);
    this.oy = 8;
    return this.cell * this.b.h + 16;
  }
  status() { return { moves: this.path.length, par: this.b.open, label: `${this.path.length}/${this.b.open}マス` }; }
  canUndo() { return this.path.length > 1; }
  undo() { if (this.path.length > 1) this.path.pop(); }
  at(x, y) { return { x: Math.floor((x - this.ox) / this.cell), y: Math.floor((y - this.oy) / this.cell) }; }
  down(x, y) {
    const c = this.at(x, y);
    const i = this.path.findIndex((p) => p.x === c.x && p.y === c.y);
    // touching the walked line picks the round up from there
    if (i >= 0) this.path = this.path.slice(0, i + 1);
    this.dragging = true;
    this.move(x, y);
  }
  move(x, y) {
    if (!this.dragging) return;
    const c = this.at(x, y);
    const end = this.path[this.path.length - 1];
    if (c.x === end.x && c.y === end.y) return;
    const prev = this.path[this.path.length - 2];
    if (prev && c.x === prev.x && c.y === prev.y) { this.path.pop(); return; }
    if (Stroke.canStep(this.b, this.path, c.x, c.y)) {
      this.path.push(c);
      if (Stroke.won(this.b, this.path)) { this.dragging = false; setTimeout(() => this.api.won(this.status()), 500); }
    }
  }
  up() { this.dragging = false; }
  draw(ctx, t) {
    const { b, cell: u } = this;
    for (let y = 0; y < b.h; y++) for (let x = 0; x < b.w; x++) {
      const X = this.ox + x * u, Y = this.oy + y * u;
      if (b.map[y][x] === '#') {
        // a garden: shrubs over a hedge
        paperTile(ctx, X, Y, u + 0.5, u + 0.5, '#9DBB7E');
        for (let k = 0; k < 3; k++) Art.ellipse(ctx, X + u * (0.3 + 0.2 * k), Y + u * (0.4 + 0.15 * (k % 2)), u * 0.22, u * 0.2, '#7FA360', Math.max(1, u * 0.03));
        continue;
      }
      paperTile(ctx, X, Y, u + 0.5, u + 0.5, (x + y) % 2 ? '#EFE5D1' : '#E8DCC4');
      ctx.strokeStyle = 'rgba(58,43,34,.14)';
      ctx.lineWidth = 1;
      ctx.strokeRect(X + 0.5, Y + 0.5, u - 1, u - 1);
    }
    // the walked line
    const P = this.path.map((p) => ({ x: this.ox + (p.x + 0.5) * u, y: this.oy + (p.y + 0.5) * u }));
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(200,69,47,.28)';
    ctx.lineWidth = u * 0.34;
    ctx.beginPath();
    P.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
    ctx.stroke();
    // paw prints along it
    for (let i = 1; i < P.length; i++) {
      const a = P[i - 1], c = P[i];
      const ang = Math.atan2(c.y - a.y, c.x - a.x);
      const mx = (a.x + c.x) / 2, my = (a.y + c.y) / 2;
      ctx.save();
      ctx.translate(mx, my);
      ctx.rotate(ang + Math.PI / 2);
      ctx.fillStyle = 'rgba(58,43,34,.35)';
      Art.ellipse(ctx, (i % 2 ? -1 : 1) * u * 0.06, 0, u * 0.05, u * 0.065, 'rgba(58,43,34,.35)');
      ctx.restore();
    }
    // houses with numbered door plates
    const next = Stroke.nextNumber(b, this.path);
    for (const [k, n] of Object.entries(b.nums)) {
      const [x, y] = k.split(',').map(Number);
      const X = this.ox + (x + 0.5) * u, Y = this.oy + (y + 0.5) * u;
      const visited = this.path.some((p) => p.x === x && p.y === y);
      if (n === 1) {
        // the shop: a small noren
        Art.rr(ctx, X - u * 0.36, Y - u * 0.38, u * 0.72, u * 0.34, u * 0.05);
        Art.inked(ctx, C.noren, Math.max(1, u * 0.03));
        ctx.fillStyle = '#F6EEDF';
        ctx.font = `${u * 0.24}px "Yusei Magic", sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('出', X, Y - u * 0.2);
        continue;
      }
      ctx.save();
      if (n === next && !visited) {
        ctx.shadowColor = C.glow;
        ctx.shadowBlur = 10 + 6 * Math.sin(t * 4);
      }
      Art.ellipse(ctx, X, Y, u * 0.26, u * 0.26, visited ? '#F3D9C9' : '#FFFBF2', Math.max(1.2, u * 0.04));
      ctx.restore();
      ctx.fillStyle = visited ? C.shu : C.ink;
      ctx.font = `${u * 0.3}px "Yusei Magic", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(n === b.last ? '終' : String(n), X, Y + 1);
    }
    // the cat at the head of the line
    const e = this.path[this.path.length - 1], p = this.path[this.path.length - 2];
    const facing = !p ? 'down' : e.x > p.x ? 'right' : e.x < p.x ? 'left' : e.y < p.y ? 'up' : 'down';
    const E = P[P.length - 1];
    Art.cat(ctx, E.x, E.y - u * 0.18, u * 0.2, { facing, t, carry: this.path.length === b.open ? [] : ['bento'] });
  }
}

// ======================================================================
// 4. 皿そろえ屋台 — sort the plates at the stall
// ======================================================================
const SORT_FOOD = { a: 'ramen', b: 'sushi', c: 'tamago', d: 'dango', e: 'onigiri' };
class SortGame {
  constructor(level, api) {
    this.api = api;
    this.level = { cap: level.cap, stacks: level.stacks.map((s) => [...s]) };
    this.par = level.par;
    this.st = Sort.init(this.level);
    this.hist = [];
    this.moves = 0;
    this.held = null;
    this.catAt = 0;
    this.catX = null;
  }
  layout(w) {
    const n = this.st.length;
    this.cw = Math.floor(Math.min((w - 16) / n, 84));
    this.ox = Math.floor((w - this.cw * n) / 2);
    this.ph = Math.floor(this.cw * 0.42);
    this.top = Math.floor(this.cw * 0.95);
    this.base = this.top + this.ph * this.level.cap + 22;
    return this.base + 30;
  }
  status() { return { moves: this.moves, par: this.par }; }
  canUndo() { return this.hist.length > 0 && !this.held; }
  undo() { if (this.canUndo()) { this.st = this.hist.pop(); this.moves--; } }
  complete(s) { return s.length === this.level.cap && s.every((d) => d === s[0]); }
  down(x) {
    const i = Math.floor((x - this.ox) / this.cw);
    if (i < 0 || i >= this.st.length) return;
    this.catAt = i;
    if (this.held === null) {
      if (!this.st[i].length || this.complete(this.st[i])) { this.wobble = { i, t: now() }; return; }
      this.held = i;
      return;
    }
    if (i === this.held) { this.held = null; return; }
    const n = Sort.move(this.level, this.st, this.held, i);
    if (!n) { this.wobble = { i, t: now() }; return; }
    this.hist.push(this.st);
    this.st = n;
    this.moves++;
    this.held = null;
    if (Sort.won(this.level, this.st)) setTimeout(() => this.api.won(this.status()), 600);
  }
  draw(ctx, t) {
    const { cw, ox, ph } = this;
    const cap = this.level.cap;
    // the stall roof
    ctx.fillStyle = '#F6E7C8';
    for (let i = 0; i < this.st.length; i++) {
      const X = ox + i * cw;
      Art.rr(ctx, X + 4, this.base - ph * cap - 14, cw - 8, ph * cap + 14, 6);
      Art.inked(ctx, 'rgba(255,251,242,.6)', 1);
    }
    // counters
    for (let i = 0; i < this.st.length; i++) {
      const X = ox + i * cw;
      Art.rr(ctx, X + 3, this.base, cw - 6, 14, 3);
      Art.inked(ctx, C.wood, 1.6);
      const s = this.st[i];
      const shake = this.wobble && this.wobble.i === i && now() - this.wobble.t < 0.35 ? Math.sin((now() - this.wobble.t) * 60) * 3 : 0;
      s.forEach((d, k) => {
        if (this.held === i && k === s.length - 1) return;
        Art.plate(ctx, X + cw / 2 + shake, this.base - ph * (k + 0.55), cw * 0.62, SORT_FOOD[d]);
      });
      if (this.complete(s)) Art.hanko(ctx, X + cw - 14, this.base - ph * cap - 4, 11, '完');
    }
    // the cat walks to the chosen counter, carrying the lifted plate
    const target = ox + this.catAt * cw + cw / 2;
    this.catX = this.catX === null ? target : this.catX + (target - this.catX) * 0.25;
    const carry = this.held !== null ? [SORT_FOOD[this.st[this.held][this.st[this.held].length - 1]]] : [];
    const r = Math.min(cw * 0.2, 18);
    Art.cat(ctx, this.catX, this.top - r * 1.9, r, { facing: 'down', t, carry, happy: Sort.won(this.level, this.st) });
  }
}

// ======================================================================
// 5. 注文あてっこ — who ordered what?
// ======================================================================
class DeduceGame {
  constructor(level, api) {
    this.api = api;
    this.level = level;
    this.n = level.dishes.length;
    this.seat = Array(this.n).fill(null); // dish index per seat
    this.sel = null; // dish index held
    this.tries = 0;
    this.result = null;
    this.hist = [];
  }
  layout(w) {
    this.w = w;
    this.sw = Math.floor(Math.min((w - 20) / this.n, 90));
    this.ox = Math.floor((w - this.sw * this.n) / 2);
    this.guestY = 70;
    this.slotY = 150;
    this.passY = 222;
    this.clueY = 282;
    this.rowH = 38;
    this.btn = { x: w / 2 - 70, y: 0, w: 140, h: 40 };
    const relational = this.level.clues.filter((c) => !['is', 'not'].includes(c.t));
    this.btn.y = this.clueY + relational.length * this.rowH + 18;
    return this.btn.y + this.btn.h + 16;
  }
  status() { return { moves: this.tries, par: 1, label: `${this.tries}回目` }; }
  canUndo() { return false; }
  undo() {}
  placedAt(d) { return this.seat.indexOf(d); }
  down(x, y) {
    const { sw, ox } = this;
    // dishes waiting on the pass
    if (y > this.passY - 26 && y < this.passY + 26) {
      const d = Math.floor((x - ox) / sw);
      if (d >= 0 && d < this.n && this.placedAt(d) < 0) this.sel = this.sel === d ? null : d;
      return;
    }
    // the seats
    if (y > this.slotY - 30 && y < this.slotY + 30) {
      const s = Math.floor((x - ox) / sw);
      if (s < 0 || s >= this.n) return;
      this.result = null;
      if (this.sel !== null) {
        const prev = this.placedAt(this.sel);
        if (prev >= 0) this.seat[prev] = null;
        this.seat[s] = this.sel;
        this.sel = null;
      } else if (this.seat[s] !== null) {
        this.seat[s] = null;
      }
      return;
    }
    const b = this.btn;
    if (x > b.x && x < b.x + b.w && y > b.y && y < b.y + b.h && this.seat.every((d) => d !== null)) {
      this.tries++;
      const right = this.seat.filter((d, s) => this.level.dishes[d] === this.level.answer[s]).length;
      this.result = { right, t: now() };
      if (right === this.n) setTimeout(() => this.api.won(this.status()), 700);
    }
  }
  drawClue(ctx, c, x, y, s) {
    const icon = (k, xx) => { Art.food(ctx, k, xx, y, s * 0.42); };
    // drawing a dish changes the fill, so set the chalk colour each time
    const T = (txt, xx) => {
      ctx.fillStyle = '#F2EEDF';
      ctx.font = `${s * 0.42}px "Zen Maru Gothic", sans-serif`;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(txt, xx, y + 1);
      return xx + ctx.measureText(txt).width;
    };
    let cx = x;
    if (c.t === 'adj') { icon(c.a, cx + s * 0.5); icon(c.b, cx + s * 1.5); T('は となりどうし', cx + s * 2.1); }
    if (c.t === 'left') { icon(c.a, cx + s * 0.5); cx = T('は', cx + s * 1.05); icon(c.b, cx + s * 0.6); T('より 左の席', cx + s * 1.15); }
    if (c.t === 'end') { icon(c.a, cx + s * 0.5); T('は はしっこの席', cx + s * 1.05); }
    if (c.t === 'mid') { icon(c.a, cx + s * 0.5); T('は はしっこじゃない', cx + s * 1.05); }
  }
  draw(ctx, t) {
    const { sw, ox, n } = this;
    const L = this.level;
    // counter
    Art.rr(ctx, ox - 8, this.slotY - 26, sw * n + 16, 52, 6);
    Art.inked(ctx, C.wood, 1.6);
    const happyAll = this.result && this.result.right === n;
    for (let s = 0; s < n; s++) {
      const X = ox + s * sw + sw / 2;
      Art.guest(ctx, X, this.guestY, Math.min(22, sw * 0.26), s, { t, happy: happyAll });
      // what this guest says about themselves
      const own = L.clues.filter((c) => (c.t === 'not' || c.t === 'is') && c.seat === s);
      own.forEach((c, k) => {
        const bx = X + sw * 0.18, by = this.guestY - 44 - k * 30;
        Art.rr(ctx, bx - 16, by - 13, 32, 26, 8);
        Art.inked(ctx, '#FFFBF2', 1.4);
        Art.food(ctx, c.a, bx, by, 9);
        if (c.t === 'not') {
          ctx.strokeStyle = C.shu; ctx.lineWidth = 2.4;
          ctx.beginPath(); ctx.moveTo(bx - 10, by - 9); ctx.lineTo(bx + 10, by + 9); ctx.moveTo(bx + 10, by - 9); ctx.lineTo(bx - 10, by + 9); ctx.stroke();
        }
      });
      // the place setting in front of them
      Art.ellipse(ctx, X, this.slotY + 4, sw * 0.34, 12, 'rgba(255,251,242,.5)', 1);
      if (this.seat[s] !== null) Art.plate(ctx, X, this.slotY, Math.min(sw * 0.8, 60), L.dishes[this.seat[s]]);
    }
    // the pass: dishes still to hand out
    ctx.fillStyle = 'rgba(126,85,53,.18)';
    ctx.fillRect(ox - 8, this.passY - 22, sw * n + 16, 44);
    for (let d = 0; d < n; d++) {
      if (this.placedAt(d) >= 0) continue;
      const X = ox + d * sw + sw / 2;
      const lift = this.sel === d ? -8 + Math.sin(t * 6) * 2 : 0;
      if (this.sel === d) Art.ellipse(ctx, X, this.passY + 4, sw * 0.34, 12, 'rgba(255,197,107,.6)');
      Art.plate(ctx, X, this.passY + lift, Math.min(sw * 0.8, 60), L.dishes[d]);
    }
    // the cat behind the pass
    Art.cat(ctx, ox - 2, this.passY - 16, 12, { facing: 'right', t, noShadow: true, happy: happyAll });
    // chalkboard with what the regulars said about each other
    const rel = L.clues.filter((c) => !['is', 'not'].includes(c.t));
    Art.rr(ctx, 10, this.clueY - 24, this.w - 20, rel.length * this.rowH + 12, 6);
    Art.inked(ctx, '#2F3A31', 3);
    rel.forEach((c, i) => this.drawClue(ctx, c, 24, this.clueY - 4 + i * this.rowH, 30));
    // serve button and the result as smiling faces
    const b = this.btn;
    const ready = this.seat.every((d) => d !== null);
    Art.rr(ctx, b.x, b.y, b.w, b.h, 8);
    Art.inked(ctx, ready ? C.shu : '#CDB9A4', 1.8);
    ctx.fillStyle = '#FFF7EA';
    ctx.font = `18px "Yusei Magic", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('お届け', b.x + b.w / 2, b.y + b.h / 2 + 1);
    if (this.result && !happyAll) {
      for (let k = 0; k < n; k++) {
        const fx = b.x + b.w + 18 + k * 18, fy = b.y + b.h / 2;
        Art.ellipse(ctx, fx, fy, 7, 7, k < this.result.right ? '#F4CF4A' : '#DDD3C4', 1.2);
      }
    }
  }
}

  },
  {
    id: 'sort', cls: SortGame, title: '皿そろえ屋台', en: 'Stall Sort',
    pitch: '縁日の屋台で、ごちゃまぜの皿を種類ごとにそろえる。',
    rule: 'タップで一番上の皿を持ち上げ、別の台へ。置けるのは空の台か、同じ料理の上だけ。',
  },
  {
    id: 'deduce', cls: DeduceGame, title: '注文あてっこ', en: 'Who Ordered What?',
    pitch: '常連さんの話を聞いて、だれが何を頼んだか当てる推理パズル。',
    rule: '料理をタップして席へ。吹き出しは本人の話、黒板はみんなの話。当たった人数が顔で出る。',
  },
];

// Menu, game screen, win receipt and saved progress.
(function () {
  const $ = (s) => document.querySelector(s);
  const store = {
    get(k, d) { try { const v = localStorage.getItem('demae-neko:' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('demae-neko:' + k, JSON.stringify(v)); } catch (e) { /* storage off: play on */ } },
  };
  const cleared = (id) => store.get('cleared:' + id, []);

  let game = null, meta = null, levelIndex = 0, canvas = null, ctx = null, cssW = 0, cssH = 0, raf = 0;

  // ---------------------------------------------------------------- menu
  function buildMenu() {
    const list = $('#cards');
    list.innerHTML = '';
    GAMES.forEach((g, i) => {
      const done = cleared(g.id).length;
      const card = document.createElement('button');
      card.className = 'card';
      card.id = 'card-' + g.id;
      card.innerHTML = `
        <canvas class="thumb" width="1" height="1" aria-hidden="true"></canvas>
        <span class="card-text">
          <span class="card-no">案${i + 1}</span>
          <span class="card-title">${g.title}</span>
          <span class="card-en">${g.en}</span>
          <span class="card-pitch">${g.pitch}</span>
          <span class="card-progress">${LEVELS[g.id].map((_, k) => `<i class="${cleared(g.id).includes(k) ? 'on' : ''}"></i>`).join('')}<b>${done}/${LEVELS[g.id].length}</b></span>
        </span>`;
      card.addEventListener('click', () => open(i, firstOpen(g.id)));
      list.appendChild(card);
      drawThumb(card.querySelector('canvas'), g);
    });
  }
  function firstOpen(id) {
    const c = cleared(id);
    for (let k = 0; k < LEVELS[id].length; k++) if (!c.includes(k)) return k;
    return 0;
  }
  function drawThumb(cv, g) {
    const W = 108, H = 108, dpr = window.devicePixelRatio || 1;
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    const c = cv.getContext('2d');
    c.scale(dpr, dpr);
    const inst = new g.cls(LEVELS[g.id][0], { won() {} });
    const h = inst.layout(300);
    const s = Math.min(W / 300, H / h);
    c.fillStyle = '#FBF5EA';
    c.fillRect(0, 0, W, H);
    c.save();
    c.translate((W - 300 * s) / 2, (H - h * s) / 2);
    c.scale(s, s);
    try { inst.draw(c, 0); } catch (e) { /* a thumbnail is optional */ }
    c.restore();
  }

  // ---------------------------------------------------------------- game
  function open(i, lv) {
    meta = GAMES[i];
    levelIndex = lv;
    $('#menu').hidden = true;
    $('#play').hidden = false;
    $('#g-title').textContent = meta.title;
    $('#g-rule').textContent = meta.rule;
    start();
    window.scrollTo(0, 0);
  }
  function start() {
    const lv = LEVELS[meta.id][levelIndex];
    game = new meta.cls(lv, { won });
    $('#receipt').hidden = true;
    $('#g-level').textContent = `${levelIndex + 1} / ${LEVELS[meta.id].length}`;
    $('#dots').innerHTML = LEVELS[meta.id].map((_, k) => `<button class="dot ${k === levelIndex ? 'cur' : ''} ${cleared(meta.id).includes(k) ? 'on' : ''}" data-k="${k}" aria-label="${k + 1}問目">${k + 1}</button>`).join('');
    $('#dots').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { levelIndex = +b.dataset.k; start(); }));
    resize();
    loop();
  }
  function resize() {
    if (!game) return;
    const box = $('#stage');
    cssW = Math.min(box.clientWidth, 520);
    cssH = game.layout(cssW);
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function loop() {
    cancelAnimationFrame(raf);
    const frame = () => {
      if (!game || $('#play').hidden) return;
      ctx.clearRect(0, 0, cssW, cssH);
      game.draw(ctx, performance.now() / 1000);
      const st = game.status();
      $('#g-moves').textContent = st.label || `${st.moves}手`;
      $('#g-par').textContent = st.label ? '' : `目標 ${st.par}手`;
      $('#undo').disabled = !game.canUndo();
      raf = requestAnimationFrame(frame);
    };
    raf = requestAnimationFrame(frame);
  }
  function won(st) {
    const c = cleared(meta.id);
    if (!c.includes(levelIndex)) store.set('cleared:' + meta.id, [...c, levelIndex]);
    const stars = st.label ? 3 : st.moves <= st.par ? 3 : st.moves <= st.par * 1.5 ? 2 : 1;
    $('#r-body').textContent = meta.id === 'deduce'
      ? `${st.moves}回目で全員に届けました`
      : meta.id === 'stroke' || meta.id === 'pack' ? 'ぴったり届けました' : `${st.moves}手で配達（目標 ${st.par}手）`;
    $('#r-stars').innerHTML = [0, 1, 2].map((k) => `<i class="${k < stars ? 'on' : ''}">済</i>`).join('');
    const last = levelIndex >= LEVELS[meta.id].length - 1;
    $('#r-next').textContent = last ? 'ほかの案へ' : '次の出前へ';
    $('#receipt').hidden = false;
    $('#dots').querySelectorAll('.dot')[levelIndex].classList.add('on');
  }
  function toMenu() {
    game = null;
    cancelAnimationFrame(raf);
    $('#play').hidden = true;
    $('#menu').hidden = false;
    buildMenu();
  }

  // --------------------------------------------------------------- input
  function pos(e) {
    const r = canvas.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  }
  function wire() {
    canvas = $('#board');
    ctx = canvas.getContext('2d');
    canvas.addEventListener('pointerdown', (e) => {
      if (!game) return;
      canvas.setPointerCapture(e.pointerId);
      game.down && game.down(...pos(e));
      e.preventDefault();
    });
    canvas.addEventListener('pointermove', (e) => { if (game && game.move && e.buttons) game.move(...pos(e)); });
    canvas.addEventListener('pointerup', (e) => { if (game && game.up) game.up(...pos(e)); });
    canvas.addEventListener('pointercancel', (e) => { if (game && game.up) game.up(...pos(e)); });
    window.addEventListener('keydown', (e) => {
      if (!game) return;
      if (game.key) game.key(e.key);
      if (e.key === 'z' || e.key === 'Backspace') game.undo();
    });
    $('#undo').addEventListener('click', () => game && game.undo());
    $('#restart').addEventListener('click', () => game && start());
    $('#back').addEventListener('click', toMenu);
    $('#r-next').addEventListener('click', () => {
      if (levelIndex >= LEVELS[meta.id].length - 1) { toMenu(); return; }
      levelIndex++;
      start();
    });
    $('#r-again').addEventListener('click', start);
    $('#rule-toggle').addEventListener('click', () => { const r = $('#g-rule'); r.hidden = !r.hidden; });
    window.addEventListener('resize', resize);
  }

  function boot() {
    wire();
    buildMenu();
    // redraw thumbnails once the fonts arrive
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(buildMenu);
    const h = location.hash.replace('#', '');
    const i = GAMES.findIndex((g) => g.id === h);
    if (i >= 0) open(i, firstOpen(GAMES[i].id));
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
