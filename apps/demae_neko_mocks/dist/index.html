<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>出前ねこ 次の一皿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
  /* One look on purpose: the washi-and-wood shop of つみあげ出前, in daylight. */
  :root {
    color-scheme: light;
    --paper: #F3EAD8; --paper-deep: #E6D6BA; --card: #FBF5EA; --ink: #3A2B22; --ink-soft: #7D6754;
    --wood: #C6955F; --wood-light: #E0B985; --wood-dark: #7E5535; --noren: #2F4B6B; --on-noren: #F6EEDF;
    --shu: #C8452F; --glow: #FFC56B; --board: #2F3A31;
    --display: "Yusei Magic", "Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif;
    --body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "BIZ UDPGothic", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { background: var(--paper); color: var(--ink); }
  body {
    margin: 0; font-family: var(--body); font-weight: 500; font-size: 15px; line-height: 1.6;
    background-image:
      radial-gradient(rgba(125,103,84,.07) 1px, transparent 1.2px),
      radial-gradient(rgba(125,103,84,.05) 1px, transparent 1.2px);
    background-size: 7px 7px, 11px 11px; background-position: 0 0, 3px 5px;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 0 32px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--glow); outline-offset: 2px; }

  /* noren banner */
  .noren { position: relative; margin-inline: -16px; padding-top: 12px; background: var(--wood-dark); }
  .noren::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 10px; background: #5E3E27; border-bottom: 2px solid var(--ink); }
  .panels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
  .panels i { display: block; height: 100%; background: var(--noren); border-radius: 0 0 5px 5px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }
  .noren-text { position: absolute; inset: 12px 0 0 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--on-noren); text-align: center; padding-inline: 12px; }
  .menu-noren .panels { height: 132px; }
  .menu-noren h1 { margin: 0; font: 400 clamp(30px, 9vw, 40px)/1.15 var(--display); letter-spacing: .06em; text-wrap: balance; }
  .menu-noren p { margin: 4px 0 0; font-size: 13px; opacity: .85; }

  .lead { margin: 18px 2px 14px; font-size: 14px; color: var(--ink-soft); }
  .lead b { color: var(--ink); font-weight: 700; }

  /* proposal cards: paper slips pinned under a wooden rail */
  #cards { display: grid; gap: 14px; }
  .card { display: grid; grid-template-columns: 108px 1fr; gap: 12px; align-items: start; width: 100%; text-align: left;
    background: var(--card); border: 2px solid var(--ink); border-radius: 6px; padding: 10px; box-shadow: 0 3px 0 rgba(58,43,34,.18); }
  .card:hover { transform: translateY(-1px); box-shadow: 0 4px 0 rgba(58,43,34,.22); }
  .card:active { transform: translateY(1px); box-shadow: 0 1px 0 rgba(58,43,34,.2); }
  .thumb { border: 1.5px solid var(--ink); border-radius: 4px; display: block; max-width: 100%; }
  .card-text { display: grid; gap: 1px; min-width: 0; }
  .card-no { font: 400 12px/1 var(--display); color: var(--shu); letter-spacing: .08em; }
  .card-title { font: 400 22px/1.25 var(--display); }
  .card-en { font-size: 11px; color: var(--ink-soft); letter-spacing: .04em; }
  .card-pitch { font-size: 13px; line-height: 1.55; margin-top: 4px; }
  .card-progress { display: flex; align-items: center; gap: 4px; margin-top: 6px; }
  .card-progress i { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--ink-soft); }
  .card-progress i.on { background: var(--shu); border-color: var(--shu); }
  .card-progress b { font-size: 11px; color: var(--ink-soft); font-weight: 500; margin-left: 4px; font-variant-numeric: tabular-nums; }

  .card { grid-template-areas: "thumb text" "chips chips"; }
  .card .thumb { grid-area: thumb; }
  .card .card-text { grid-area: text; }
  .chips { grid-area: chips; display: flex; flex-wrap: wrap; gap: 5px; margin: 2px 0 0; padding: 0; list-style: none; }
  .chips li, .chip { font-size: 11.5px; line-height: 1.3; padding: 3px 8px; border-radius: 999px; border: 1.5px dashed var(--ink-soft); color: var(--ink-soft); background: transparent; }
  .chips li.on, .chip.on { border-style: solid; border-color: var(--shu); color: var(--shu); background: #FFF4EC; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin: -4px 2px 14px; }
  .card-no.kept { color: var(--noren); }
  .note { margin-top: 22px; padding: 12px 14px; background: rgba(255,251,242,.7); border: 1.5px dashed var(--ink-soft); border-radius: 6px; font-size: 13px; color: var(--ink-soft); }

  /* play screen */
  .play-noren .panels { height: 76px; }
  .play-noren .noren-text { flex-direction: row; justify-content: space-between; gap: 8px; }
  .tag { flex: none; border: 2px solid var(--ink); background: var(--wood-light); border-radius: 6px 6px 8px 8px; padding: 6px 10px; font: 400 15px/1 var(--display); color: var(--ink); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .tag:disabled { opacity: .45; cursor: default; }
  .tag.dark { background: var(--wood-dark); color: var(--on-noren); }
  .ptitle { min-width: 0; text-align: center; }
  .ptitle h2 { margin: 0; font: 400 22px/1.2 var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ptitle span { font-size: 12px; opacity: .85; font-variant-numeric: tabular-nums; }
  .chalk { flex: none; background: var(--board); color: #F2EEDF; border: 2px solid var(--wood-dark); border-radius: 5px; padding: 3px 8px; text-align: right; min-width: 72px; }
  .chalk b { display: block; font: 400 18px/1.1 var(--display); font-variant-numeric: tabular-nums; }
  .chalk span { font-size: 10.5px; opacity: .8; }
  .rule { display: flex; gap: 8px; align-items: flex-start; margin: 12px 0 6px; }
  .rule-text { flex: 1; display: grid; gap: 6px; min-width: 0; }
  .rule p { margin: 0; font-size: 13px; line-height: 1.6; background: var(--card); border: 1.5px solid var(--ink); border-radius: 6px; padding: 6px 10px; }
  .rule .gnote { background: #FFF1D6; border-color: var(--shu); color: var(--ink); font-weight: 700; }
  .rule button { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--ink); background: var(--card); font: 400 16px/1 var(--display); }
  #stage { display: flex; justify-content: center; padding-block: 6px; }
  #board { touch-action: none; display: block; max-width: 100%; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-top: 6px; }
  .tools .left { display: flex; gap: 8px; }
  #dots { display: flex; gap: 6px; }
  .dot { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--ink-soft); background: var(--card); font-size: 12px; font-variant-numeric: tabular-nums; }
  .dot.on { border-color: var(--shu); color: var(--shu); }
  .dot.cur { background: var(--ink); color: var(--card); border-color: var(--ink); }

  /* receipt */
  #receipt { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; pointer-events: none; }
  .slip { pointer-events: auto; width: 100%; max-width: 420px; background: #FFFBF2; border: 2px solid var(--ink); border-radius: 6px 6px 2px 2px; padding: 14px 16px 16px; box-shadow: 0 -4px 18px rgba(58,43,34,.25); animation: rise .35s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes rise { from { transform: translateY(40px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .slip { animation: none; } }
  .slip h3 { margin: 0; font: 400 26px/1.2 var(--display); color: var(--shu); }
  .slip p { margin: 2px 0 8px; font-size: 13px; color: var(--ink-soft); }
  #r-stars { display: flex; gap: 8px; margin-bottom: 12px; }
  #r-stars i { width: 34px; height: 34px; border-radius: 50%; border: 2px dashed #CDB9A4; display: grid; place-items: center; font: 400 15px/1 var(--display); font-style: normal; color: transparent; }
  #r-stars i.on { border: 2.5px solid var(--shu); color: var(--shu); transform: rotate(-8deg); }
  .slip .row { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }
  .btn { border: 2px solid var(--ink); border-radius: 6px; padding: 9px 10px; background: var(--wood-light); font: 400 16px/1 var(--display); box-shadow: 0 2px 0 rgba(0,0,0,.2); }
  .btn.shu { background: var(--shu); color: #FFF7EA; }
</style>

<main class="wrap">
  <section id="menu">
    <header class="noren menu-noren">
      <div class="panels"><i></i><i></i><i></i></div>
      <div class="noren-text">
        <h1>出前ねこ 次の一皿</h1>
        <p>つみあげ出前のねこが主人公の、次のゲーム案</p>
      </div>
    </header>
    <p class="lead">前回の案から<b>おかもち詰め</b>を残し、<b>しかけを足していける</b>ことを軸に新しい4案を作りました。どの案も4問で、2問目からしかけが1つずつ増えます。全問、解けることと、目標手数が最短であることを確かめてあります。</p>
    <p class="legend"><span class="chip on">モックで遊べるしかけ</span><span class="chip">これから足せるしかけ</span></p>
    <div id="cards"></div>
    <p class="note">進み具合はこの端末のブラウザにだけ保存されます。絵と遊び心地の確認用なので、音はありません。</p>
  </section>

  <section id="play" hidden>
    <header class="noren play-noren">
      <div class="panels"><i></i><i></i><i></i></div>
      <div class="noren-text">
        <button id="back" class="tag" aria-label="案の一覧へ戻る">←</button>
        <div class="ptitle"><h2 id="g-title"></h2><span id="g-level"></span></div>
        <div class="chalk"><b id="g-moves">0手</b><span id="g-par"></span></div>
      </div>
    </header>
    <div class="rule"><div class="rule-text"><p id="g-rule"></p><p id="g-note" class="gnote" hidden></p></div><button id="rule-toggle" aria-label="ルールの表示を切り替える">?</button></div>
    <div id="stage"><canvas id="board" width="1" height="1"></canvas></div>
    <div class="tools">
      <div class="left">
        <button id="undo" class="tag">戻す</button>
        <button id="restart" class="tag dark">やり直す</button>
      </div>
      <div id="dots"></div>
    </div>
  </section>

  <div id="receipt" hidden>
    <div class="slip" role="dialog" aria-labelledby="r-title">
      <h3 id="r-title">毎度あり！</h3>
      <p id="r-body"></p>
      <div id="r-stars"></div>
      <div class="row">
        <button id="r-again" class="btn">もう一度</button>
        <button id="r-next" class="btn shu">次の出前へ</button>
      </div>
    </div>
  </div>
</main>

<script>
// Rules for the five mock games, free of any drawing so that node can
// check every level (tool/verify.js) and the page can play them.
(function (root) {
  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  const DIR_LIST = ['up', 'down', 'left', 'right'];

  function bfs(start, key, next, won, limit = 200000) {
    const seen = new Map([[key(start), null]]);
    const queue = [start];
    for (let i = 0; i < queue.length; i++) {
      const s = queue[i];
      if (won(s)) {
        const path = [];
        let k = key(s);
        while (seen.get(k)) {
          const [prev, move] = seen.get(k);
          path.unshift(move);
          k = prev;
        }
        return path;
      }
      if (queue.length > limit) return undefined;
      for (const [move, t] of next(s)) {
        const kt = key(t);
        if (!seen.has(kt)) {
          seen.set(kt, [key(s), move]);
          queue.push(t);
        }
      }
    }
    return null;
  }

  // ------------------------------------------------------------------ 0. pack
  // Fill the okamochi (the delivery box) with every dish. Hot and cold
  // dishes may not touch; soups have to sit on the bottom shelf.
  function norm(cells) {
    const mx = Math.min(...cells.map((c) => c[0])), my = Math.min(...cells.map((c) => c[1]));
    return cells.map(([x, y]) => [x - mx, y - my]).sort((a, b) => a[1] - b[1] || a[0] - b[0]);
  }
  function rotations(cells) {
    const out = [];
    let cur = norm(cells);
    for (let i = 0; i < 4; i++) {
      const k = JSON.stringify(cur);
      if (!out.some((o) => JSON.stringify(o) === k)) out.push(cur);
      cur = norm(cur.map(([x, y]) => [-y, x]));
    }
    return out;
  }
  const Pack = {
    // level: { box: ['....', ...] ('#' = no shelf), pieces: [{ cells:[[x,y]...], kind:'hot'|'cold'|'plain', soup?:bool, food }] }
    rotations,
    rotate(cells) { return norm(cells.map(([x, y]) => [-y, x])); },
    norm,
    free(level) {
      const out = [];
      level.box.forEach((row, y) => [...row].forEach((c, x) => { if (c !== '#') out.push([x, y]); }));
      return out;
    },
    // placed: [{ piece:i, x, y, cells(rotated, normalised) }]
    grid(level, placed) {
      const h = level.box.length, w = level.box[0].length;
      const g = Array.from({ length: h }, () => Array(w).fill(-1));
      for (const p of placed) for (const [cx, cy] of p.cells) g[p.y + cy][p.x + cx] = p.piece;
      return g;
    },
    canPlace(level, placed, piece, cells, x, y) {
      const h = level.box.length, w = level.box[0].length;
      const g = Pack.grid(level, placed);
      for (const [cx, cy] of cells) {
        const gx = x + cx, gy = y + cy;
        if (gx < 0 || gy < 0 || gx >= w || gy >= h) return false;
        if (level.box[gy][gx] === '#' || g[gy][gx] >= 0) return false;
      }
      return true;
    },
    // rule breaks in a (partial) packing: pairs of touching hot/cold pieces
    // and soups off the bottom shelf
    problems(level, placed) {
      const g = Pack.grid(level, placed);
      const h = g.length, w = g[0].length;
      const clash = new Set();
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const a = g[y][x];
        if (a < 0) continue;
        for (const [dx, dy] of [[1, 0], [0, 1]]) {
          const bx = x + dx, by = y + dy;
          if (bx >= w || by >= h) continue;
          const b = g[by][bx];
          if (b < 0 || b === a) continue;
          const ka = level.pieces[a].kind, kb = level.pieces[b].kind;
          if ((ka === 'hot' && kb === 'cold') || (ka === 'cold' && kb === 'hot')) { clash.add(a); clash.add(b); }
        }
      }
      const floating = new Set();
      for (const p of placed) {
        if (!level.pieces[p.piece].soup) continue;
        // the bottom shelf is the lowest open row in that column
        const ok = p.cells.some(([cx, cy]) => {
          const x = p.x + cx, y = p.y + cy;
          for (let yy = y + 1; yy < h; yy++) if (level.box[yy][x] !== '#') return false;
          return true;
        });
        if (!ok) floating.add(p.piece);
      }
      return { clash, floating };
    },
    won(level, placed) {
      if (placed.length !== level.pieces.length) return false;
      const pr = Pack.problems(level, placed);
      return pr.clash.size === 0 && pr.floating.size === 0;
    },
    // number of valid packings (capped), for checking a level has exactly one
    count(level, cap = 2) {
      const h = level.box.length, w = level.box[0].length;
      const rots = level.pieces.map((p) => rotations(p.cells));
      const used = Array(level.pieces.length).fill(false);
      const placed = [];
      let n = 0;
      const g = Array.from({ length: h }, (_, y) => Array.from({ length: w }, (_, x) => (level.box[y][x] === '#' ? -2 : -1)));
      const rec = () => {
        if (n >= cap) return;
        let fx = -1, fy = -1;
        outer: for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (g[y][x] === -1) { fx = x; fy = y; break outer; }
        if (fx < 0) {
          if (Pack.won(level, placed)) n++;
          return;
        }
        const tried = new Set();
        for (let i = 0; i < level.pieces.length; i++) {
          if (used[i]) continue;
          const sig = JSON.stringify([level.pieces[i].kind, !!level.pieces[i].soup, rots[i].map((r) => JSON.stringify(r)).sort()[0]]);
          if (tried.has(sig)) continue; // identical pieces: try once
          tried.add(sig);
          for (const r of rots[i]) {
            const [ax, ay] = r[0];
            const ox = fx - ax, oy = fy - ay;
            if (!r.every(([cx, cy]) => { const x = ox + cx, y = oy + cy; return x >= 0 && y >= 0 && x < w && y < h && g[y][x] === -1; })) continue;
            r.forEach(([cx, cy]) => { g[oy + cy][ox + cx] = i; });
            used[i] = true;
            placed.push({ piece: i, x: ox, y: oy, cells: r });
            const pr = Pack.problems(level, placed);
            if (pr.clash.size === 0) rec();
            placed.pop();
            used[i] = false;
            r.forEach(([cx, cy]) => { g[oy + cy][ox + cx] = -1; });
          }
        }
      };
      rec();
      return n;
    },
  };

  const STEP = (x, y, dir) => [x + DIRS[dir][0], y + DIRS[dir][1]];
  const isWall = (map, x, y) => y < 0 || x < 0 || y >= map.length || x >= map[0].length || map[y][x] === '#';

  // ----------------------------------------------------------------- 1. oden
  // Push the ingredients into the oden pots. Each pot takes them only in the
  // order on its recipe card.
  // Gimmicks: several pots, ice (a pushed ingredient keeps sliding),
  // and more to come (see README).
  const Oden = {
    // level: { map: rows with '#' wall, '.' floor, '_' ice, 'P' cat,
    //          lower-case ingredient, upper-case pot }, recipes: { A: 'dec' } }
    parse(level) {
      const items = [], pots = [];
      let start = null;
      level.map.forEach((row, y) => [...row].forEach((c, x) => {
        if (c === 'P') start = { x, y };
        else if (/[a-z]/.test(c)) items.push({ x, y, k: c });
        else if (/[A-Z]/.test(c)) pots.push({ x, y, id: c, recipe: level.recipes[c] });
      }));
      return { map: level.map, items, pots, start };
    },
    ice(b, x, y) { return !isWall(b.map, x, y) && b.map[y][x] === '_'; },
    init(b) { return { x: b.start.x, y: b.start.y, items: b.items.map((i) => ({ ...i })), prog: b.pots.map(() => 0) }; },
    potAt(b, x, y) { return b.pots.findIndex((p) => p.x === x && p.y === y); },
    itemAt(s, x, y) { return s.items.findIndex((i) => i.x === x && i.y === y); },
    // opts.anyOrder: recipes accept their ingredients in any order (used to
    // check that the order matters when generating levels)
    move(b, s, dir, opts = {}) {
      const [nx, ny] = STEP(s.x, s.y, dir);
      if (isWall(b.map, nx, ny) || Oden.potAt(b, nx, ny) >= 0) return null;
      const ii = Oden.itemAt(s, nx, ny);
      if (ii < 0) return { state: { ...s, x: nx, y: ny }, push: null };
      const item = s.items[ii];
      const accepts = (pi) => {
        const p = b.pots[pi], k = s.prog[pi];
        if (k >= p.recipe.length) return false;
        return opts.anyOrder ? p.recipe.includes(item.k) : p.recipe[k] === item.k;
      };
      let [tx, ty] = STEP(nx, ny, dir);
      const path = [];
      let into = -1;
      for (;;) {
        const pi = Oden.potAt(b, tx, ty);
        if (pi >= 0) { if (accepts(pi)) into = pi; break; }
        if (isWall(b.map, tx, ty) || Oden.itemAt(s, tx, ty) >= 0) break;
        path.push({ x: tx, y: ty });
        if (!Oden.ice(b, tx, ty)) break;
        [tx, ty] = STEP(tx, ty, dir);
      }
      if (!path.length && into < 0) return null;
      const items = s.items.filter((_, i) => i !== ii);
      const prog = [...s.prog];
      if (into >= 0) {
        prog[into]++;
      } else {
        const end = path[path.length - 1];
        items.push({ x: end.x, y: end.y, k: item.k });
      }
      return { state: { x: nx, y: ny, items, prog }, push: { from: { x: nx, y: ny }, path, into, k: item.k } };
    },
    key(s) { return `${s.x},${s.y}|${s.items.map((i) => `${i.k}${i.x},${i.y}`).sort().join(';')}|${s.prog.join(',')}`; },
    won(b, s) { return b.pots.every((p, i) => s.prog[i] >= p.recipe.length); },
    solve(b, opts = {}) {
      return bfs(Oden.init(b), Oden.key,
        (s) => DIR_LIST.map((d) => [d, Oden.move(b, s, d, opts)]).filter(([, r]) => r).map(([d, r]) => [d, r.state]),
        (s) => Oden.won(b, s), 400000);
    },
  };

  // ---------------------------------------------------------------- 2. light
  // Guide the lamp's light to the paper lanterns by pushing the folding
  // mirror screens. Gimmicks: red paper (turns the light red for red
  // lanterns), a bamboo blind (lets half the light through, reflects half).
  const REFLECT = {
    '/': { right: 'up', up: 'right', left: 'down', down: 'left' },
    '\\': { right: 'down', down: 'right', left: 'up', up: 'left' },
  };
  const Light = {

    ctx.save();
    ctx.beginPath();
    ctx.ellipse(x, y, r * 1.02, r * 0.9, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#FFFDF8';
    ctx.fill();
    ctx.clip();
    // calico patches
    Art.ellipse(ctx, x - r * 0.72 - side * r * 0.1, y - r * 0.55, r * 0.6, r * 0.45, '#E39A52');
    Art.ellipse(ctx, x + r * 0.85 - side * r * 0.1, y - r * 0.5, r * 0.42, r * 0.36, '#5A4034');
    if (face === 'up') Art.ellipse(ctx, x + r * 0.1, y + r * 0.1, r * 0.5, r * 0.4, '#E39A52');
    ctx.restore();
    ctx.beginPath();
    ctx.ellipse(x, y, r * 1.02, r * 0.9, 0, 0, Math.PI * 2);
    Art.inked(ctx, null, lw);
    // headband
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(x, y, r * 1.02, r * 0.9, 0, 0, Math.PI * 2);
    ctx.clip();
    ctx.fillStyle = C.shu;
    ctx.beginPath();
    ctx.moveTo(x - r * 1.1, y - r * 0.5);
    ctx.quadraticCurveTo(x, y - r * 0.28, x + r * 1.1, y - r * 0.5);
    ctx.lineTo(x + r * 1.1, y - r * 0.26);
    ctx.quadraticCurveTo(x, y - r * 0.04, x - r * 1.1, y - r * 0.26);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
    // knot and tails, fluttering
    const kx = x + (face === 'left' ? r * 0.95 : -r * 0.95), ky = y - r * 0.38;
    const flap = Math.sin(t * 5) * r * 0.06;
    const dirK = face === 'left' ? 1 : -1;
    ctx.fillStyle = C.shu;
    for (const k of [0, 1]) {
      ctx.beginPath();
      ctx.moveTo(kx, ky);
      ctx.lineTo(kx + dirK * r * (0.55 + k * 0.1), ky - r * (0.25 - k * 0.35) + flap * (k ? -1 : 1));
      ctx.lineTo(kx + dirK * r * (0.45 + k * 0.1), ky - r * (0.05 - k * 0.35) + flap * (k ? -1 : 1));
      ctx.closePath();
      Art.inked(ctx, C.shu, lw * 0.8);
    }
    Art.ellipse(ctx, kx, ky, r * 0.12, r * 0.12, C.shu, lw * 0.8);
    // face
    if (face !== 'up') {
      const fx = x + side * r * 0.22;
      const blink = o.happy || (Math.sin(t * 1.3) > 0.985);
      ctx.strokeStyle = C.ink;
      ctx.fillStyle = C.ink;
      ctx.lineWidth = lw;
      for (const s of [-1, 1]) {
        const ex = fx + s * r * 0.36, ey = y + r * 0.05;
        if (blink) {
          ctx.beginPath();
          ctx.arc(ex, ey + r * 0.05, r * 0.11, Math.PI * 1.1, Math.PI * 1.9);
          ctx.stroke();
        } else {
          Art.ellipse(ctx, ex, ey, r * 0.085, r * 0.11, C.ink);
          Art.ellipse(ctx, ex + r * 0.03, ey - r * 0.04, r * 0.03, r * 0.03, '#fff');
        }
      }
      Art.ellipse(ctx, fx - r * 0.6, y + r * 0.3, r * 0.14, r * 0.08, 'rgba(236,140,130,.55)');
      Art.ellipse(ctx, fx + r * 0.6, y + r * 0.3, r * 0.14, r * 0.08, 'rgba(236,140,130,.55)');
      ctx.beginPath();
      ctx.moveTo(fx - r * 0.07, y + r * 0.2);
      ctx.lineTo(fx + r * 0.07, y + r * 0.2);
      ctx.lineTo(fx, y + r * 0.28);
      ctx.closePath();
      ctx.fillStyle = '#E58C86';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(fx - r * 0.08, y + r * 0.3, r * 0.08, 0.1 * Math.PI, 0.9 * Math.PI);
      ctx.arc(fx + r * 0.08, y + r * 0.3, r * 0.08, 0.1 * Math.PI, 0.9 * Math.PI);
      ctx.lineWidth = lw * 0.8;
      ctx.strokeStyle = C.ink;
      ctx.stroke();
    }
    // plates carried on the head
    (o.carry || []).forEach((kind, i) => Art.plate(ctx, x, y - r * (1.05 + i * 0.42), r * 0.85, kind));
  },

  // -------------------------------------------------------------- guests
  guest(ctx, x, y, r, type, o = {}) {
    const lw = Math.max(1.2, r * 0.09);
    const g = [
      { hair: '#3B3029', shirt: '#6F8FB4', glasses: true }, // salaryman
      { hair: '#B8B4AE', shirt: '#A07BB0', bun: true }, // grandma
      { hair: '#5A3A2A', shirt: '#E2A0A0', bob: true }, // girl
      { hair: '#3B3029', shirt: '#7FA36A', cap: true }, // boy
      { hair: '#8C8278', shirt: '#C9A26A', beard: true }, // grandpa
    ][type % 5];
    const bob = o.happy ? Math.sin((o.t || 0) * 6) * r * 0.06 : 0;
    const shake = o.upset ? Math.sin((o.t || 0) * 40) * r * 0.08 * Math.max(0, 1 - (o.upsetAge || 0) / 0.6) : 0;
    x += shake; y += bob;
    Art.shadow(ctx, x, y + r * 1.55, r * 0.9, r * 0.22);
    Art.rr(ctx, x - r * 0.78, y + r * 0.62, r * 1.56, r * 0.95, r * 0.4);
    Art.inked(ctx, g.shirt, lw);
    if (g.bun) Art.ellipse(ctx, x, y - r * 0.95, r * 0.35, r * 0.28, g.hair, lw);
    Art.ellipse(ctx, x, y, r * 0.86, r * 0.84, C.skin, lw);
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(x, y, r * 0.86, r * 0.84, 0, 0, Math.PI * 2);
    ctx.clip();
    ctx.fillStyle = g.hair;
    if (g.bob) {
      ctx.fillRect(x - r, y - r, r * 2, r * 0.62);
      ctx.fillRect(x - r, y - r, r * 0.3, r * 1.6);
      ctx.fillRect(x + r * 0.7, y - r, r * 0.3, r * 1.6);
    } else if (g.cap) {
      ctx.fillStyle = '#3F6FA0';
      ctx.fillRect(x - r, y - r, r * 2, r * 0.55);
    } else {
      ctx.beginPath();
      ctx.ellipse(x, y - r * 0.72, r * 0.95, r * 0.5, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
    ctx.beginPath();
    ctx.ellipse(x, y, r * 0.86, r * 0.84, 0, 0, Math.PI * 2);
    Art.inked(ctx, null, lw);
    if (g.cap) {
      ctx.beginPath();
      ctx.moveTo(x - r * 0.2, y - r * 0.44);
      ctx.lineTo(x + r * 1.0, y - r * 0.4);
      ctx.lineWidth = lw * 1.6;
      ctx.strokeStyle = '#3F6FA0';
      ctx.stroke();
    }
    // face
    ctx.strokeStyle = C.ink;
    ctx.fillStyle = C.ink;
    ctx.lineWidth = lw;
    for (const s of [-1, 1]) {
      if (o.happy) {
        ctx.beginPath();
        ctx.arc(x + s * r * 0.3, y + r * 0.08, r * 0.1, Math.PI * 1.1, Math.PI * 1.9);
        ctx.stroke();
      } else Art.ellipse(ctx, x + s * r * 0.3, y + r * 0.05, r * 0.07, r * 0.09, C.ink);
    }
    if (g.glasses) {
      ctx.lineWidth = lw * 0.7;
      for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(x + s * r * 0.3, y + r * 0.05, r * 0.19, 0, Math.PI * 2); ctx.stroke(); }
    }
    if (g.beard) Art.ellipse(ctx, x, y + r * 0.55, r * 0.35, r * 0.2, '#E8E2DA', lw * 0.6);
    ctx.beginPath();
    if (o.happy) ctx.arc(x, y + r * 0.3, r * 0.16, 0.1 * Math.PI, 0.9 * Math.PI);
    else if (o.upset) ctx.arc(x, y + r * 0.48, r * 0.14, 1.15 * Math.PI, 1.85 * Math.PI);
    else { ctx.moveTo(x - r * 0.1, y + r * 0.4); ctx.lineTo(x + r * 0.1, y + r * 0.4); }
    ctx.lineWidth = lw * 0.9;
    ctx.stroke();
    Art.ellipse(ctx, x - r * 0.55, y + r * 0.3, r * 0.12, r * 0.07, 'rgba(236,140,130,.45)');
    Art.ellipse(ctx, x + r * 0.55, y + r * 0.3, r * 0.12, r * 0.07, 'rgba(236,140,130,.45)');
    if (o.happy) Art.note(ctx, x + r * 0.9, y - r * 0.9 - bob * 2, r * 0.5);
  },
  note(ctx, x, y, s) {
    ctx.fillStyle = C.shu;
    ctx.font = `bold ${s}px "Zen Maru Gothic", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('♪', x, y);
  },
  // order ticket: a small paper slip with a dish on it
  ticket(ctx, x, y, s, kind, o = {}) {
    const lw = Math.max(1, s * 0.07);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(o.tilt || -0.06);
    Art.rr(ctx, -s * 0.55, -s * 0.55, s * 1.1, s * 1.1, s * 0.12);
    Art.inked(ctx, o.done ? '#EFE6D2' : '#FFFBF2', lw);
    ctx.globalAlpha = o.done ? 0.45 : 1;
    Art.food(ctx, kind, 0, s * 0.02, s * 0.38);
    ctx.globalAlpha = 1;
    if (o.done) Art.hanko(ctx, s * 0.22, s * 0.2, s * 0.26, '済');
    ctx.restore();
  },
  hanko(ctx, x, y, r, ch) {
    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.lineWidth = r * 0.16;
    ctx.strokeStyle = C.shu;
    ctx.stroke();
    ctx.fillStyle = C.shu;
    ctx.font = `bold ${r * 1.1}px "Yusei Magic", "Zen Maru Gothic", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(ch, x, y + r * 0.05);
    ctx.restore();
  },

  // --------------------------------------------------------------- dishes
  plate(ctx, x, y, r, kind) {
    const lw = Math.max(1, r * 0.07);
    Art.ellipse(ctx, x, y + r * 0.18, r * 0.62, r * 0.2, '#FFFDF6', lw);
    ctx.beginPath();
    ctx.ellipse(x, y + r * 0.18, r * 0.44, r * 0.12, 0, 0, Math.PI);
    ctx.strokeStyle = '#4A6F9E';
    ctx.lineWidth = lw * 0.8;
    ctx.stroke();
    Art.food(ctx, kind, x, y - r * 0.04, r * 0.36);
  },
  food(ctx, kind, x, y, r) {
    const lw = Math.max(1, r * 0.12);
    const E = (xx, yy, rx, ry, f, l = lw) => Art.ellipse(ctx, xx, yy, rx, ry, f, l);
    switch (kind) {
      case 'ramen': case 'miso': {
        E(x, y - r * 0.1, r, r * 0.4, kind === 'ramen' ? '#F2D39A' : '#B7803F');
        ctx.beginPath();
        ctx.moveTo(x - r, y - r * 0.1);
        ctx.quadraticCurveTo(x - r * 0.9, y + r * 0.9, x, y + r * 0.9);
        ctx.quadraticCurveTo(x + r * 0.9, y + r * 0.9, x + r, y - r * 0.1);
        Art.inked(ctx, kind === 'ramen' ? '#C8452F' : '#3A2B22', lw);
        if (kind === 'ramen') {
          E(x + r * 0.35, y - r * 0.12, r * 0.22, r * 0.12, '#FFF6F2', lw * 0.6);
          ctx.strokeStyle = '#6E9C58'; ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(x - r * 0.5, y - r * 0.15); ctx.lineTo(x - r * 0.15, y - r * 0.05); ctx.stroke();
        } else {
          E(x - r * 0.3, y - r * 0.12, r * 0.1, r * 0.06, '#E8E2C8', 0);
          E(x + r * 0.2, y - r * 0.05, r * 0.1, r * 0.06, '#6E9C58', 0);
        }
        break;
      }
      case 'soba': {
        Art.rr(ctx, x - r, y - r * 0.2, r * 2, r * 0.8, r * 0.2);
        Art.inked(ctx, '#C9A26A', lw);
        E(x, y - r * 0.1, r * 0.75, r * 0.4, '#8C7A68', lw);
        ctx.strokeStyle = '#6A5A4A'; ctx.lineWidth = lw * 0.6;
        for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(x - r * 0.5, y - r * 0.1 + i * r * 0.12); ctx.quadraticCurveTo(x, y + i * r * 0.12, x + r * 0.5, y - r * 0.1 + i * r * 0.12); ctx.stroke(); }
        break;
      }
      case 'sushi': {
        for (const s of [-1, 1]) {
          Art.rr(ctx, x + s * r * 0.5 - r * 0.42, y - r * 0.1, r * 0.84, r * 0.55, r * 0.2);
          Art.inked(ctx, '#FFFDF6', lw);
          Art.rr(ctx, x + s * r * 0.5 - r * 0.48, y - r * 0.42, r * 0.96, r * 0.4, r * 0.18);
          Art.inked(ctx, s < 0 ? '#F08A5D' : '#D8433A', lw);
        }
        break;
      }
      case 'tamago': {
        Art.rr(ctx, x - r * 0.8, y - r * 0.45, r * 1.6, r * 0.9, r * 0.15);
        Art.inked(ctx, '#F4CF4A', lw);
        ctx.fillStyle = '#2F3B2F';
        ctx.fillRect(x - r * 0.15, y - r * 0.45, r * 0.3, r * 0.9);
        break;
      }
      case 'onigiri': {
        ctx.beginPath();
        ctx.moveTo(x, y - r * 0.85);
        ctx.quadraticCurveTo(x + r * 0.2, y - r * 0.85, x + r * 0.85, y + r * 0.45);
        ctx.quadraticCurveTo(x + r * 0.9, y + r * 0.7, x + r * 0.6, y + r * 0.7);
        ctx.lineTo(x - r * 0.6, y + r * 0.7);
        ctx.quadraticCurveTo(x - r * 0.9, y + r * 0.7, x - r * 0.85, y + r * 0.45);
        ctx.quadraticCurveTo(x - r * 0.2, y - r * 0.85, x, y - r * 0.85);
        Art.inked(ctx, '#FFFDF6', lw);
        ctx.fillStyle = '#2F3B2F';
        ctx.fillRect(x - r * 0.4, y + r * 0.2, r * 0.8, r * 0.5);
        break;
      }
      case 'gyoza': {
        for (const s of [-1, 0, 1]) {
          ctx.beginPath();
          ctx.ellipse(x + s * r * 0.55, y, r * 0.32, r * 0.55, s * 0.2, 0, Math.PI * 2);
          Art.inked(ctx, '#F2D8A8', lw);
          ctx.beginPath();
          ctx.moveTo(x + s * r * 0.55 - r * 0.2, y + r * 0.35);
          ctx.lineTo(x + s * r * 0.55 + r * 0.2, y + r * 0.35);
          ctx.strokeStyle = '#C98A45'; ctx.lineWidth = lw * 1.4; ctx.stroke();
        }
        break;
      }
      case 'tempura': {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(-0.5);
        E(0, 0, r * 0.95, r * 0.36, '#EDB654');
        ctx.beginPath(); ctx.moveTo(r * 0.9, 0); ctx.lineTo(r * 1.2, -r * 0.25); ctx.lineTo(r * 1.2, r * 0.25); ctx.closePath();
        Art.inked(ctx, '#E0553B', lw);
        ctx.restore();
        break;
      }
      case 'purin': {
        ctx.beginPath();
        ctx.moveTo(x - r * 0.5, y - r * 0.5);
        ctx.lineTo(x + r * 0.5, y - r * 0.5);
        ctx.lineTo(x + r * 0.75, y + r * 0.55);
        ctx.lineTo(x - r * 0.75, y + r * 0.55);
        ctx.closePath();
        Art.inked(ctx, '#F6D77A', lw);
        E(x, y - r * 0.52, r * 0.5, r * 0.16, '#8A4E22', lw);
        break;
      }
      case 'salad': {
        E(x, y + r * 0.1, r, r * 0.55, '#DDEFF6', lw);
        for (const [dx, dy, c] of [[-0.4, -0.1, '#7FB069'], [0.1, -0.2, '#5E9A4C'], [0.45, 0, '#D8433A'], [-0.05, 0.1, '#9CCB7A']]) E(x + dx * r, y + dy * r, r * 0.3, r * 0.2, c, lw * 0.6);
        break;
      }
      case 'dango': {
        ctx.strokeStyle = '#A8845A'; ctx.lineWidth = lw * 1.2;
        ctx.beginPath(); ctx.moveTo(x - r, y + r * 0.6); ctx.lineTo(x + r, y - r * 0.6); ctx.stroke();
        [['#F2B8C6', -0.5], ['#FFFDF6', 0], ['#8CBF6A', 0.5]].forEach(([c, k]) => E(x + k * r * 1.1, y - k * r * 0.66, r * 0.33, r * 0.33, c));
        break;
      }
      case 'bento': {
        Art.rr(ctx, x - r, y - r * 0.7, r * 2, r * 1.4, r * 0.18);
        Art.inked(ctx, '#2B2B2B', lw);
        Art.rr(ctx, x - r * 0.85, y - r * 0.55, r * 0.95, r * 1.1, r * 0.1);
        Art.inked(ctx, '#FFFDF6', lw * 0.6);
        E(x - r * 0.38, y, r * 0.14, r * 0.14, '#D8433A', 0);
        E(x + r * 0.5, y - r * 0.2, r * 0.3, r * 0.2, '#F4CF4A', lw * 0.6);
        E(x + r * 0.5, y + r * 0.3, r * 0.3, r * 0.2, '#7FB069', lw * 0.6);
        break;
      }
      // oden
      case 'daikon': {
        E(x, y + r * 0.25, r * 0.8, r * 0.35, '#F3E7C4');
        ctx.beginPath();
        ctx.rect(x - r * 0.8, y - r * 0.3, r * 1.6, r * 0.55);
        ctx.fillStyle = '#F3E7C4'; ctx.fill();
        ctx.beginPath(); ctx.moveTo(x - r * 0.8, y - r * 0.3); ctx.lineTo(x - r * 0.8, y + r * 0.25); ctx.moveTo(x + r * 0.8, y - r * 0.3); ctx.lineTo(x + r * 0.8, y + r * 0.25);
        ctx.lineWidth = lw; ctx.strokeStyle = C.ink; ctx.stroke();
        E(x, y - r * 0.3, r * 0.8, r * 0.35, '#E6CFA0');
        break;
      }
      case 'egg': {
        E(x, y, r * 0.62, r * 0.82, '#C98A45');
        E(x - r * 0.15, y - r * 0.25, r * 0.15, r * 0.22, 'rgba(255,255,255,.4)', 0);
        break;
      }
      case 'chikuwa': {
        ctx.save(); ctx.translate(x, y); ctx.rotate(-0.4);
        Art.rr(ctx, -r, -r * 0.34, r * 2, r * 0.68, r * 0.34);
        Art.inked(ctx, '#E9D2A0', lw);
        ctx.fillStyle = '#B86F35';
        ctx.fillRect(-r * 0.7, -r * 0.34, r * 1.4, r * 0.3);
        E(r * 0.95, 0, r * 0.14, r * 0.3, '#7A4A2A', lw * 0.6);
        ctx.restore();
        break;
      }
      case 'konnyaku': {
        ctx.beginPath(); ctx.moveTo(x, y - r * 0.8); ctx.lineTo(x + r * 0.85, y + r * 0.6); ctx.lineTo(x - r * 0.85, y + r * 0.6); ctx.closePath();
        Art.inked(ctx, '#8C8A86', lw);
        ctx.fillStyle = '#5E5C58';
        for (const [dx, dy] of [[-0.2, 0.2], [0.2, 0.3], [0, -0.1], [-0.35, 0.45], [0.4, 0.45]]) ctx.fillRect(x + dx * r, y + dy * r, r * 0.07, r * 0.07);
        break;
      }
      case 'ganmo': {
        E(x, y, r * 0.85, r * 0.7, '#C9803F');
        ctx.fillStyle = '#6E9C58';
        ctx.fillRect(x - r * 0.3, y - r * 0.1, r * 0.12, r * 0.12);
        ctx.fillStyle = '#D8433A';
        ctx.fillRect(x + r * 0.2, y + r * 0.1, r * 0.12, r * 0.12);
        break;
      }
      default: E(x, y, r * 0.7, r * 0.7, '#ddd');
    }
  },
};

const FOOD_NAME = {
  daikon: '大根', egg: '卵', chikuwa: 'ちくわ', konnyaku: 'こんにゃく', ganmo: 'がんも',
  ramen: 'ラーメン', soba: 'ざるそば', sushi: 'お寿司', tamago: '卵焼き', onigiri: 'おにぎり', gyoza: '餃子',
  miso: 'みそ汁', tempura: '天ぷら', purin: 'プリン', salad: 'サラダ', dango: 'だんご', bento: 'お弁当',
};

// A seeded wobble for hand-drawn lines.
function wob(i, j, k = 0) {
  const s = Math.sin(i * 127.1 + j * 311.7 + k * 74.7) * 43758.5453;
  return s - Math.floor(s) - 0.5;
}

// The mock games. Each one draws into a canvas of the width it is
// given and handles pointer input in canvas pixels (CSS px).
const { Pack } = Logic;
const ease = (p) => 1 - Math.pow(1 - Math.min(1, Math.max(0, p)), 3);
const now = () => performance.now() / 1000;

function paperTile(ctx, x, y, w, h, fill) {
  ctx.fillStyle = fill;
  ctx.fillRect(x, y, w, h);
}

// ======================================================================
// 0. おかもち詰め (kept from the first round) — pack the delivery box
// ======================================================================
class PackGame {
  constructor(level, api) {
    this.api = api;
    this.level = level;
    this.rot = level.pieces.map((p) => p.cells);
    this.placed = [];
    this.hist = [];
    this.moves = 0;
    this.drag = null;
    this.problemAt = 0;
  }
  layout(w) {
    const L = this.level;
    const bw = L.box[0].length, bh = L.box.length;
    this.cell = Math.floor(Math.min((w - 40) / bw, 58));
    this.bx = Math.floor((w - this.cell * bw) / 2);
    this.by = 16;
    this.w = w;
    // tray below, pieces laid out left to right in rows, each in a slot
    // big enough for any turn of it
    this.tc = Math.floor(this.cell * 0.72);
    let x = 12, y = this.by + this.cell * bh + 40, rowH = 0;
    this.trayTop = y - 16;
    this.slots = this.level.pieces.map((p) => {
      const ext = Math.max(...p.cells.map((c) => Math.max(c[0], c[1]))) + 1;
      const box = ext * this.tc + 8;
      if (x + box > w - 8) { x = 12; y += rowH + 10; rowH = 0; }
      const slot = { x, y, w: box, h: box };
      x += box + 10;
      rowH = Math.max(rowH, box);
      return slot;
    });
    return y + rowH + 18;
  }
  status() { return { moves: this.moves, par: this.level.pieces.length, label: `${this.placed.length}/${this.level.pieces.length}品` }; }
  canUndo() { return this.hist.length > 0; }
  undo() {
    if (!this.hist.length) return;
    const h = this.hist.pop();
    this.placed = h.placed;
    this.rot = h.rot;
    this.moves--;
  }
  snapshot() { this.hist.push({ placed: this.placed.map((p) => ({ ...p })), rot: [...this.rot] }); }
  inTray(i) { return !this.placed.some((p) => p.piece === i); }
  pieceAtBox(x, y) {
    const gx = Math.floor((x - this.bx) / this.cell), gy = Math.floor((y - this.by) / this.cell);

  down(x, y) {
    const onBox = this.pieceAtBox(x, y);

      return;
    }

  }
  move(x, y) { if (this.drag) { this.drag.x = x; this.drag.y = y; } }

    const tap = Math.hypot(x - d.x0, y - d.y0) < 8;
    const others = this.placed.filter((p) => p.piece !== d.piece);
    if (tap) {

      this.snapshot();
      if (d.from === 'tray') { this.rot[d.piece] = r; this.hist.pop(); return; }

      } else {
        this.placed = others;
        this.rot[d.piece] = r;
      }
      this.after();
      return;
    }
    // drop where the dragged dish's top-left cell lands
    const g = this.ghost(d);
    const gx = Math.round((g.x - this.bx) / this.cell), gy = Math.round((g.y - this.by) / this.cell);
    this.snapshot();
    if (Pack.canPlace(this.level, others, d.piece, d.cells, gx, gy)) {
      this.placed = [...others, { piece: d.piece, x: gx, y: gy, cells: d.cells }];
      this.moves++;
    } else {
      this.placed = others;
      this.rot[d.piece] = d.cells;
      if (d.from === 'tray') this.hist.pop();
    }
    this.after();
  }
  after() {
    const pr = Pack.problems(this.level, this.placed);
    if (pr.clash.size || pr.floating.size) this.problemAt = now();
    if (Pack.won(this.level, this.placed)) setTimeout(() => this.api.won(this.status()), 500);
  }
  // top-left of a dragged dish, drawn at box scale under the finger
  ghost(d) {
    const u = this.cell;
    const w = Math.max(...d.cells.map((c) => c[0])) + 1, h = Math.max(...d.cells.map((c) => c[1])) + 1;
    return { x: d.x - (w * u) / 2, y: d.y - (h * u) / 2 - u * 0.6, u };
  }
  drawPiece(ctx, i, cells, ox, oy, u, o = {}) {
    const p = this.level.pieces[i];
    const fill = { hot: '#F7CBAE', cold: '#CFE4F2', plain: '#F4E7C9' }[p.kind];
    const lw = Math.max(1.2, u * 0.05);
    const set = new Set(cells.map(([x, y]) => `${x},${y}`));
    ctx.save();
    if (o.alpha) ctx.globalAlpha = o.alpha;
    for (const [cx, cy] of cells) paperTile(ctx, ox + cx * u, oy + cy * u, u + 0.5, u + 0.5, fill);
    // texture: steam for hot, frost for cold
    for (const [cx, cy] of cells) {
      const X = ox + cx * u, Y = oy + cy * u;
      ctx.strokeStyle = p.kind === 'hot' ? 'rgba(200,69,47,.35)' : p.kind === 'cold' ? 'rgba(60,120,170,.35)' : 'rgba(125,103,84,.18)';
      ctx.lineWidth = Math.max(1, u * 0.035);
      ctx.beginPath();
      if (p.kind === 'hot') {
        for (const k of [0.3, 0.7]) { ctx.moveTo(X + u * k, Y + u * 0.8); ctx.bezierCurveTo(X + u * (k - 0.1), Y + u * 0.6, X + u * (k + 0.1), Y + u * 0.4, X + u * k, Y + u * 0.2); }
      } else if (p.kind === 'cold') {
        for (const [a, b2] of [[0.25, 0.25], [0.75, 0.7]]) { const r = u * 0.08; ctx.moveTo(X + u * a - r, Y + u * b2); ctx.lineTo(X + u * a + r, Y + u * b2); ctx.moveTo(X + u * a, Y + u * b2 - r); ctx.lineTo(X + u * a, Y + u * b2 + r); }
      }
      ctx.stroke();
    }
    // outline only the outer edges, so one dish reads as one shape
    ctx.strokeStyle = o.warn ? C.shu : C.ink;
    ctx.lineWidth = o.warn ? lw * 2 : lw;
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (const [cx, cy] of cells) {
      const X = ox + cx * u, Y = oy + cy * u;
      if (!set.has(`${cx},${cy - 1}`)) { ctx.moveTo(X, Y); ctx.lineTo(X + u, Y); }
      if (!set.has(`${cx},${cy + 1}`)) { ctx.moveTo(X, Y + u); ctx.lineTo(X + u, Y + u); }
      if (!set.has(`${cx - 1},${cy}`)) { ctx.moveTo(X, Y); ctx.lineTo(X, Y + u); }
      if (!set.has(`${cx + 1},${cy}`)) { ctx.moveTo(X + u, Y); ctx.lineTo(X + u, Y + u); }
    }
    ctx.stroke();
    // the dish on the cell nearest the middle
    const mx = cells.reduce((s, c) => s + c[0], 0) / cells.length, my = cells.reduce((s, c) => s + c[1], 0) / cells.length;
    const [fx, fy] = cells.slice().sort((a, b) => Math.hypot(a[0] - mx, a[1] - my) - Math.hypot(b[0] - mx, b[1] - my))[0];
    Art.food(ctx, p.food, ox + (fx + 0.5) * u, oy + (fy + 0.5) * u, u * 0.3);
    if (p.soup) {
      // soups show a little arrow pointing to the floor of the box
      const X = ox + (fx + 0.5) * u, Y = oy + (fy + 0.92) * u;
      ctx.fillStyle = o.floating ? C.shu : C.inkSoft;
      ctx.beginPath(); ctx.moveTo(X - u * 0.1, Y - u * 0.1); ctx.lineTo(X + u * 0.1, Y - u * 0.1); ctx.lineTo(X, Y); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  draw(ctx, t) {
    const L = this.level, u = this.cell;
    const bw = L.box[0].length, bh = L.box.length;
    // the okamochi: lacquered box with a brass handle
    const X = this.bx, Y = this.by;
    ctx.fillStyle = '#6E2A20';
    Art.rr(ctx, X - 12, Y - 10, bw * u + 24, bh * u + 22, 8);
    Art.inked(ctx, '#7A3024', 2);
    ctx.strokeStyle = '#B08A45';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(X + bw * u * 0.3, Y - 10); ctx.lineTo(X + bw * u * 0.3, Y - 16); ctx.lineTo(X + bw * u * 0.7, Y - 16); ctx.lineTo(X + bw * u * 0.7, Y - 10);
    ctx.stroke();
    for (let y = 0; y < bh; y++) for (let x = 0; x < bw; x++) {
      const cx = X + x * u, cy = Y + y * u;
      if (L.box[y][x] === '#') {
        paperTile(ctx, cx, cy, u + 0.5, u + 0.5, '#5C241B');
        continue;
      }
      paperTile(ctx, cx, cy, u + 0.5, u + 0.5, '#EADAB9');
      ctx.strokeStyle = 'rgba(58,43,34,.2)';
      ctx.lineWidth = 1;
      ctx.strokeRect(cx + 0.5, cy + 0.5, u - 1, u - 1);
    }
    // shelf boards between rows
    for (let y = 1; y < bh; y++) {
      ctx.fillStyle = 'rgba(110,42,32,.35)';
      ctx.fillRect(X, Y + y * u - 1.5, bw * u, 3);
    }
    const pr = Pack.problems(L, this.placed);
    const shake = now() - this.problemAt < 0.4 ? Math.sin((now() - this.problemAt) * 50) * 2 : 0;
    for (const p of this.placed) {
      if (this.drag && this.drag.piece === p.piece) continue;
      const warn = pr.clash.has(p.piece);
      this.drawPiece(ctx, p.piece, p.cells, X + p.x * u + (warn ? shake : 0), Y + p.y * u, u, { warn, floating: pr.floating.has(p.piece) });
    }
    // tray
    Art.rr(ctx, 6, this.trayTop, this.w - 12, 8, 3);
    Art.inked(ctx, C.woodDark, 1.5);
    this.slots.forEach((s, i) => {
      if (!this.inTray(i) || (this.drag && this.drag.piece === i)) return;
      const cells = this.rot[i];
      const w = Math.max(...cells.map((c) => c[0])) + 1, h = Math.max(...cells.map((c) => c[1])) + 1;
      this.drawPiece(ctx, i, cells, s.x + (s.w - w * this.tc) / 2, s.y + (s.h - h * this.tc) / 2, this.tc);
    });
    // the dish being dragged, at box scale
    if (this.drag && Math.hypot(this.drag.x - this.drag.x0, this.drag.y - this.drag.y0) >= 8) {
      const g = this.ghost(this.drag);
      const gx = Math.round((g.x - this.bx) / u), gy = Math.round((g.y - this.by) / u);
      const others = this.placed.filter((p) => p.piece !== this.drag.piece);
      if (Pack.canPlace(L, others, this.drag.piece, this.drag.cells, gx, gy)) {
        ctx.fillStyle = 'rgba(255,197,107,.35)';
        for (const [cx, cy] of this.drag.cells) ctx.fillRect(X + (gx + cx) * u, Y + (gy + cy) * u, u, u);
      }
      this.drawPiece(ctx, this.drag.piece, this.drag.cells, g.x, g.y, u, { alpha: 0.9 });
    }
    // the cat waits beside the box with the lid
    Art.cat(ctx, Math.max(28, X - 34), Y + bh * u - 22, 16, { facing: 'right', t, noShadow: false });
  }
}

// ======================================================================
// Shared: a cat walking a grid, pushing things (oden, light, fusuma)
// ======================================================================
class GridGame {
  constructor(level, api, rules, board) {
    this.api = api;
    this.level = level;
    this.R = rules;
    this.b = board;
    this.s = rules.init(board);
    this.prev = this.s;
    this.hist = [];
    this.moves = 0;
    this.facing = 'down';
    this.anim = null;
    this.W = (board.map || level.map)[0].length;
    this.H = (board.map || level.map).length;
  }
  layout(w) {
    this.u = Math.floor(Math.min(w / this.W, 60));
    this.ox = Math.floor((w - this.u * this.W) / 2);
    this.oy = 8;
    return this.u * this.H + 16;
  }
  status() { return { moves: this.moves, par: this.level.par }; }
  canUndo() { return this.hist.length > 0; }
  undo() {
    if (!this.hist.length) return;
    this.s = this.hist.pop();
    this.prev = this.s;
    this.anim = null;
    this.moves--;
  }
  won() { return this.R.won(this.b, this.s); }
  go(dir) {
    if (this.won()) return;
    if (this.anim && now() - this.anim.t0 < this.anim.dur * 0.6) return;
    this.facing = dir;
    const r = this.R.move(this.b, this.s, dir);
    if (!r || !r.state) { this.bump = { dir, t: now(), info: r }; return; }
    this.hist.push(this.s);
    this.prev = this.s;
    this.s = r.state;
    this.last = r;
    this.anim = { t0: now(), dur: 0.14 + (r.push && r.push.path ? r.push.path.length * 0.06 : 0) };
    this.moves++;
    if (this.won()) setTimeout(() => this.api.won(this.status()), 650);
  }
  p() { return this.anim ? Math.min(1, (now() - this.anim.t0) / this.anim.dur) : 1; }
  cellC(x, y) { return { x: this.ox + (x + 0.5) * this.u, y: this.oy + (y + 0.5) * this.u }; }
  catAt() {
    const e = ease(this.p());
    const x = this.prev.x + (this.s.x - this.prev.x) * e, y = this.prev.y + (this.s.y - this.prev.y) * e;
    let bx = 0, by = 0;
    if (this.bump && now() - this.bump.t < 0.25) {
      const d = Logic.DIRS[this.bump.dir];
      const k = Math.sin(((now() - this.bump.t) / 0.25) * Math.PI) * this.u * 0.1;
      bx = d[0] * k; by = d[1] * k;
    }
    const c = this.cellC(x, y);
    return { x: c.x + bx, y: c.y + by };
  }
  bumped(since = 0.4) { return this.bump && now() - this.bump.t < since ? this.bump : null; }
  down(x, y) { this.p0 = { x, y }; }
  up(x, y) {
    if (!this.p0) return;
    let dx = x - this.p0.x, dy = y - this.p0.y;
    this.p0 = null;
    if (Math.hypot(dx, dy) < 14) {
      const c = this.cellC(this.s.x, this.s.y);
      dx = x - c.x; dy = y - c.y;
      if (Math.hypot(dx, dy) < this.u * 0.4) return;
    }
    this.go(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  }
  key(k) {
    const m = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' }[k];
    if (m) this.go(m);
  }
  drawCat(ctx, t, o = {}) {
    const c = this.catAt();
    Art.cat(ctx, c.x, c.y - this.u * 0.16, this.u * 0.23, { facing: this.facing, t, happy: this.won(), ...o });
  }
}

// ======================================================================
// 1. おでん仕込み — push the ingredients into the pot, in recipe order
// ======================================================================
const ODEN = { d: 'daikon', e: 'egg', c: 'chikuwa', k: 'konnyaku', g: 'ganmo' };
const POT_MARK = [['一', '#C8452F'], ['二', '#2F4B6B']];
class OdenGame extends GridGame {
  constructor(level, api) {
    const b = Logic.Oden.parse(level);
    super(level, api, Logic.Oden, b);
  }
  layout(w) {
    const h = super.layout(w);
    this.w = w;
    this.oy += 52; // recipe cards above the kitchen
    return h + 52;
  }
  draw(ctx, t) {
    const { b, u } = this;
    const s = this.s, P = this.p();
    for (let y = 0; y < this.H; y++) for (let x = 0; x < this.W; x++) {
      const X = this.ox + x * u, Y = this.oy + y * u;
      const c = b.map[y][x];
      if (c === '#') {
        paperTile(ctx, X, Y, u + 0.5, u + 0.5, '#9A7250');
        ctx.fillStyle = 'rgba(255,255,255,.08)';
        ctx.fillRect(X, Y + u * 0.1, u, u * 0.12);
        continue;
      }
      paperTile(ctx, X, Y, u + 0.5, u + 0.5, (x + y) % 2 ? '#EAD9B8' : '#E3CFAA');
      ctx.strokeStyle = 'rgba(58,43,34,.12)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(X, Y + u * 0.5); ctx.lineTo(X + u, Y + u * 0.5); ctx.stroke();
      if (c === '_') {
        // slippery wet boards
        Art.rr(ctx, X + 2, Y + 2, u - 4, u - 4, u * 0.1);
        ctx.fillStyle = 'rgba(134,184,218,.55)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,.8)';
        ctx.lineWidth = Math.max(1, u * 0.04);
        ctx.beginPath(); ctx.moveTo(X + u * 0.2, Y + u * 0.35); ctx.lineTo(X + u * 0.45, Y + u * 0.25); ctx.moveTo(X + u * 0.55, Y + u * 0.72); ctx.lineTo(X + u * 0.8, Y + u * 0.62); ctx.stroke();
      }
    }
    // pots with their recipe cards
    const bump = this.bumped(0.6);
    b.pots.forEach((pot, i) => {
      const c = this.cellC(pot.x, pot.y);
      Art.ellipse(ctx, c.x, c.y + u * 0.08, u * 0.44, u * 0.34, '#4A3A30', Math.max(1.2, u * 0.04));
      Art.ellipse(ctx, c.x, c.y - u * 0.02, u * 0.36, u * 0.22, '#C99A55', Math.max(1, u * 0.03));
      // what is already in the pot
      pot.recipe.slice(0, s.prog[i]).split('').forEach((k, j) => Art.food(ctx, ODEN[k], c.x + (j - 1) * u * 0.18, c.y - u * 0.04, u * 0.1));
      // steam
      ctx.strokeStyle = 'rgba(255,255,255,.7)';
      ctx.lineWidth = Math.max(1, u * 0.03);
      for (const k of [-1, 1]) {
        const sway = Math.sin(t * 2 + k) * u * 0.04;
        ctx.beginPath(); ctx.moveTo(c.x + k * u * 0.12, c.y - u * 0.2); ctx.quadraticCurveTo(c.x + k * u * 0.2 + sway, c.y - u * 0.35, c.x + k * u * 0.1, c.y - u * 0.48); ctx.stroke();
      }
      // a mark on the pot matching its recipe card
      const [ch, col] = POT_MARK[i];
      Art.ellipse(ctx, c.x + u * 0.34, c.y - u * 0.3, u * 0.14, u * 0.14, col, 1.2);
      ctx.fillStyle = '#FFF7EA';
      ctx.font = `${u * 0.18}px "Yusei Magic", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(ch, c.x + u * 0.34, c.y - u * 0.29);
    });
    // recipe cards: ingredients in order, the next one marked
    const wrongPot = bump && bump.info === null ? (() => {
      const [dx, dy] = Logic.DIRS[bump.dir];
      const it = s.items.find((q) => q.x === s.x + dx && q.y === s.y + dy);
      return it ? b.pots.findIndex((pp) => pp.x === it.x + dx && pp.y === it.y + dy) : -1;
    })() : -1;
    let rx = 8;
    b.pots.forEach((pot, i) => {
      const n = pot.recipe.length;
      const cw = 34;
      const W = 30 + n * cw;
      const shake = wrongPot === i ? Math.sin((now() - bump.t) * 50) * 3 : 0;
      const X = rx + shake, Y = 6;
      Art.rr(ctx, X, Y, W, 40, 5);
      Art.inked(ctx, '#FFFBF2', 1.4);
      const [ch, col] = POT_MARK[i];
      Art.ellipse(ctx, X + 15, Y + 20, 10, 10, col, 1.2);
      ctx.fillStyle = '#FFF7EA';
      ctx.font = '13px "Yusei Magic", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(ch, X + 15, Y + 21);
      pot.recipe.split('').forEach((k, j) => {
        const done = j < s.prog[i], next = j === s.prog[i];
        const cx = X + 30 + (j + 0.5) * cw;
        if (next) {
          ctx.strokeStyle = wrongPot === i ? C.shu : '#E0A93A';
          ctx.lineWidth = 2.2;
          Art.rr(ctx, cx - cw / 2 + 2, Y + 4, cw - 4, 32, 4);
          ctx.stroke();
        }
        ctx.globalAlpha = done ? 0.3 : 1;
        Art.food(ctx, ODEN[k], cx, Y + 20, 11);
        ctx.globalAlpha = 1;
        if (done) Art.hanko(ctx, cx + 8, Y + 12, 7, '済');
        if (j < n - 1) { ctx.fillStyle = C.inkSoft; ctx.font = '10px sans-serif'; ctx.fillText('›', cx + cw / 2, Y + 20); }
      });
      rx += W + 10;
    });
    // ingredients (the one just pushed slides along its path)
    const push = this.anim && P < 1 && this.last && this.last.push;
    s.items.forEach((it) => {
      let c = this.cellC(it.x, it.y);
      if (push && push.into < 0 && push.path.length && push.path[push.path.length - 1].x === it.x && push.path[push.path.length - 1].y === it.y) {
        const a = this.cellC(push.from.x, push.from.y);
        c = { x: a.x + (c.x - a.x) * ease(P), y: a.y + (c.y - a.y) * ease(P) };
      }
      Art.shadow(ctx, c.x, c.y + u * 0.28, u * 0.28, u * 0.08);
      Art.food(ctx, ODEN[it.k], c.x, c.y, u * 0.3);
    });
    if (push && push.into >= 0) {
      const a = this.cellC(push.from.x, push.from.y), pot = b.pots[push.into], z = this.cellC(pot.x, pot.y);
      const e = ease(P);
      Art.food(ctx, ODEN[push.k], a.x + (z.x - a.x) * e, a.y + (z.y - a.y) * e - Math.sin(e * Math.PI) * u * 0.3, u * 0.3 * (1 - e * 0.5));
    }
    this.drawCat(ctx, t);
  }
}

// ======================================================================
// 2. あかり届け — push the folding mirrors to light the lanterns
// ======================================================================
class LightGame extends GridGame {
  constructor(level, api) {
    const b = Logic.Light.parse(level);
    super(level, api, Logic.Light, b);
  }
  draw(ctx, t) {
    const { b, u } = this;
    const s = this.s, P = this.p();
    for (let y = 0; y < this.H; y++) for (let x = 0; x < this.W; x++) {
      const X = this.ox + x * u, Y = this.oy + y * u;
      if (b.map[y][x] === '#') { paperTile(ctx, X, Y, u + 0.5, u + 0.5, '#2E2833'); continue; }
      paperTile(ctx, X, Y, u + 0.5, u + 0.5, (x + y) % 2 ? '#4A4552' : '#443F4C');
      ctx.strokeStyle = 'rgba(255,255,255,.05)';
      ctx.strokeRect(X + 0.5, Y + 0.5, u - 1, u - 1);
    }
    for (const f of b.filters) {
      const c = this.cellC(f.x, f.y);
      Art.rr(ctx, c.x - u * 0.4, c.y - u * 0.4, u * 0.8, u * 0.8, u * 0.06);
      ctx.fillStyle = 'rgba(214,64,52,.55)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,190,180,.7)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    // the light
    const { segs, lit } = Logic.Light.trace(b, s);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for (const g of segs) {
      const a = this.cellC(g.x, g.y), z = this.cellC(g.nx, g.ny);
      const zz = g.stop ? { x: (a.x + z.x) / 2 + (z.x - a.x) * 0.0, y: (a.y + z.y) / 2 } : z;
      for (const [wdt, al] of [[u * 0.34, 0.12], [u * 0.14, 0.35], [u * 0.05, 0.9]]) {
        ctx.strokeStyle = g.red ? `rgba(255,90,70,${al})` : `rgba(255,214,120,${al})`;
        ctx.lineWidth = wdt;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(zz.x, zz.y); ctx.stroke();
      }
    }
    ctx.restore();
    // the lamp
    const sc = this.cellC(b.src.x, b.src.y);
    Art.rr(ctx, sc.x - u * 0.22, sc.y - u * 0.3, u * 0.44, u * 0.56, u * 0.05);
    Art.inked(ctx, '#FFF3D6', Math.max(1.2, u * 0.035));
    const [ddx, ddy] = Logic.DIRS[b.src.dir];
    Art.ellipse(ctx, sc.x + ddx * u * 0.28, sc.y + ddy * u * 0.28, u * 0.08, u * 0.08, C.glow, 1);
    // lanterns
    b.targets.forEach((tg, i) => {
      const c = this.cellC(tg.x, tg.y);
      const on = Logic.Light.litOk(b, lit, i);
      if (on) {
        const g = ctx.createRadialGradient(c.x, c.y, 2, c.x, c.y, u * 0.7);
        g.addColorStop(0, tg.red ? 'rgba(255,110,90,.6)' : 'rgba(255,210,120,.6)');
        g.addColorStop(1, 'rgba(255,200,120,0)');
        ctx.fillStyle = g;
        ctx.fillRect(c.x - u, c.y - u, u * 2, u * 2);
      }
      ctx.fillStyle = C.ink;
      ctx.fillRect(c.x - u * 0.16, c.y - u * 0.36, u * 0.32, u * 0.07);
      ctx.fillRect(c.x - u * 0.16, c.y + u * 0.29, u * 0.32, u * 0.07);
      Art.ellipse(ctx, c.x, c.y, u * 0.26, u * 0.3, tg.red ? (on ? '#FF6B55' : '#9E3A30') : on ? '#FFE9B0' : '#CFC6B8', Math.max(1.2, u * 0.035));
      ctx.strokeStyle = 'rgba(58,43,34,.35)';
      ctx.lineWidth = 1;
      for (const k of [-0.12, 0, 0.12]) { ctx.beginPath(); ctx.moveTo(c.x - u * 0.25, c.y + k * u); ctx.lineTo(c.x + u * 0.25, c.y + k * u); ctx.stroke(); }
    });
    // folding screens (pushable) and the bamboo blind (fixed)
    const screen = (c, o, blind) => {
      const k = o === '/' ? 1 : -1;
      ctx.lineCap = 'round';
      ctx.strokeStyle = C.ink;
      ctx.lineWidth = u * 0.16;
      ctx.beginPath(); ctx.moveTo(c.x - u * 0.34, c.y + k * u * 0.34); ctx.lineTo(c.x + u * 0.34, c.y - k * u * 0.34); ctx.stroke();
      ctx.strokeStyle = blind ? '#A9B77E' : '#E8C766';
      ctx.lineWidth = u * 0.1;
      // a bamboo blind is slatted: light slips through between the slats
      if (blind) ctx.setLineDash([u * 0.05, u * 0.04]);
      ctx.stroke();
      ctx.setLineDash([]);
      if (blind) {
        ctx.strokeStyle = 'rgba(58,43,34,.6)';
        ctx.lineWidth = 1;
        for (let i = -2; i <= 2; i++) {
          const mx = c.x + i * u * 0.12, my = c.y - k * i * u * 0.12;
          ctx.beginPath(); ctx.moveTo(mx - u * 0.05, my - u * 0.05 * k * -1); ctx.lineTo(mx + u * 0.05, my + u * 0.05 * k * -1); ctx.stroke();
        }
      }
    };
    for (const bl of b.blinds) screen(this.cellC(bl.x, bl.y), bl.o, true);
    const push = this.anim && P < 1 && this.last && this.last.push;
    for (const m of s.mirrors) {
      let c = this.cellC(m.x, m.y);
      if (push && push.to.x === m.x && push.to.y === m.y) {
        const a = this.cellC(push.from.x, push.from.y);
        c = { x: a.x + (c.x - a.x) * ease(P), y: a.y + (c.y - a.y) * ease(P) };
      }
      Art.shadow(ctx, c.x, c.y + u * 0.3, u * 0.3, u * 0.07);
      screen(c, m.o, false);
    }
    this.drawCat(ctx, t);
  }
}

// ======================================================================
// 3. ふすま渡り — slide the doors to reach the guest room
// ======================================================================
class FusumaGame extends GridGame {
  constructor(level, api) {
    const b = Logic.Fusuma.parse(level);
    super(level, api, Logic.Fusuma, b);
  }
  draw(ctx, t) {
    const { b, u } = this;
    const s = this.s, P = this.p();
    for (let y = 0; y < this.H; y++) for (let x = 0; x < this.W; x++) {
      const X = this.ox + x * u, Y = this.oy + y * u;
      const c = b.map[y][x];
      if (c === '#') { paperTile(ctx, X, Y, u + 0.5, u + 0.5, '#6B4A33'); continue; }
      paperTile(ctx, X, Y, u + 0.5, u + 0.5, (x + y) % 2 ? '#D9D3A6' : '#D2CB9C');
      ctx.strokeStyle = 'rgba(90,110,60,.25)';
      ctx.lineWidth = 1;
      for (let k = 1; k < 5; k++) { ctx.beginPath(); ctx.moveTo(X + 2, Y + (k * u) / 5); ctx.lineTo(X + u - 2, Y + (k * u) / 5); ctx.stroke(); }
      ctx.strokeStyle = 'rgba(58,43,34,.35)';
      ctx.strokeRect(X + 0.5, Y + 0.5, u - 1, u - 1);
    }
    // the guest room: a cushion and the guest waiting
    const g = this.cellC(b.goal.x, b.goal.y);
    Art.rr(ctx, g.x - u * 0.4, g.y - u * 0.4, u * 0.8, u * 0.8, u * 0.12);
    Art.inked(ctx, '#B84A3A', Math.max(1.2, u * 0.035));
    if (!(s.x === b.goal.x && s.y === b.goal.y)) Art.guest(ctx, g.x, g.y - u * 0.1, u * 0.22, 1, { t, happy: this.won() });
    // the landlady's key
    if (b.key && !s.key) {
      const k = this.cellC(b.key.x, b.key.y);
      const bob = Math.sin(t * 3) * u * 0.03;
      Art.ellipse(ctx, k.x - u * 0.1, k.y + bob, u * 0.12, u * 0.12, '#E8C766', Math.max(1.2, u * 0.03));
      ctx.strokeStyle = C.ink; ctx.lineWidth = u * 0.07;
      ctx.beginPath(); ctx.moveTo(k.x, k.y + bob); ctx.lineTo(k.x + u * 0.28, k.y + bob); ctx.moveTo(k.x + u * 0.2, k.y + bob); ctx.lineTo(k.x + u * 0.2, k.y + u * 0.1 + bob); ctx.stroke();
      ctx.strokeStyle = '#E8C766'; ctx.lineWidth = u * 0.04; ctx.stroke();
    }
    // the doors
    const bump = this.bumped(0.35);
    const moving = this.anim && P < 1 && this.last && this.last.push ? this.last.push.moving : [];
    b.panels.forEach((p, i) => {
      let pos = s.pos[i];
      if (moving.includes(i)) {
        const a = this.prev.pos[i];
        pos = { x: a.x + (pos.x - a.x) * ease(P), y: a.y + (pos.y - a.y) * ease(P) };
      }
      let X = this.ox + pos.x * u, Y = this.oy + pos.y * u;
      const w = p.axis === 'h' ? p.len * u : u, h = p.axis === 'h' ? u : p.len * u;
      if (bump && bump.info && bump.info.panel === i) {
        const k = Math.sin((now() - bump.t) * 60) * 2;
        X += k; Y += k;
      }
      const inset = u * 0.12;
      const x0 = X + (p.axis === 'v' ? inset : 2), y0 = Y + (p.axis === 'h' ? inset : 2);
      const ww = w - (p.axis === 'v' ? inset * 2 : 4), hh = h - (p.axis === 'h' ? inset * 2 : 4);
      ctx.fillStyle = 'rgba(58,43,34,.18)';
      ctx.fillRect(x0 + 2, y0 + 3, ww, hh);
      Art.rr(ctx, x0, y0, ww, hh, 3);
      Art.inked(ctx, p.link ? '#DCE6EE' : '#F6EEDB', Math.max(1.5, u * 0.05));
      // frame and paper pattern
      ctx.strokeStyle = '#7A5638';
      ctx.lineWidth = Math.max(1, u * 0.04);
      ctx.strokeRect(x0 + 3, y0 + 3, ww - 6, hh - 6);
      if (p.link) {
        // paired doors share an indigo wave crest
        ctx.strokeStyle = C.noren;
        ctx.lineWidth = Math.max(1, u * 0.035);
        for (let k = 0; k < p.len; k++) {
          const cx = p.axis === 'h' ? x0 + (k + 0.5) * u : x0 + ww / 2, cy = p.axis === 'h' ? y0 + hh / 2 : y0 + (k + 0.5) * u;
          ctx.beginPath(); ctx.arc(cx, cy + u * 0.05, u * 0.12, Math.PI, 2 * Math.PI); ctx.arc(cx, cy + u * 0.05, u * 0.06, Math.PI, 2 * Math.PI); ctx.stroke();
        }
      }
      // handle
      const hx = p.axis === 'h' ? x0 + ww - u * 0.3 : x0 + ww / 2, hy = p.axis === 'h' ? y0 + hh / 2 : y0 + hh - u * 0.3;
      Art.ellipse(ctx, hx, hy, u * 0.07, u * 0.07, '#5A4034', 1);
      // track arrows show which way it slides
      ctx.fillStyle = 'rgba(122,86,56,.55)';
      const m = { x: x0 + ww / 2, y: y0 + hh / 2 };
      for (const sgn of [-1, 1]) {
        ctx.beginPath();
        if (p.axis === 'h') { const ax = m.x + sgn * (ww / 2 - u * 0.12); ctx.moveTo(ax, m.y); ctx.lineTo(ax - sgn * u * 0.1, m.y - u * 0.07); ctx.lineTo(ax - sgn * u * 0.1, m.y + u * 0.07); }
        else { const ay = m.y + sgn * (hh / 2 - u * 0.12); ctx.moveTo(m.x, ay); ctx.lineTo(m.x - u * 0.07, ay - sgn * u * 0.1); ctx.lineTo(m.x + u * 0.07, ay - sgn * u * 0.1); }
        ctx.fill();
      }
      if (p.lock) {
        const lx = m.x, ly = m.y;
        Art.rr(ctx, lx - u * 0.12, ly - u * 0.05, u * 0.24, u * 0.2, 2);
        Art.inked(ctx, s.key ? '#C9B98A' : C.shu, 1.2);
        ctx.beginPath(); ctx.arc(lx + (s.key ? u * 0.06 : 0), ly - u * 0.05, u * 0.08, Math.PI, 2 * Math.PI);
        ctx.strokeStyle = C.ink; ctx.lineWidth = 1.6; ctx.stroke();
      }
    });
    this.drawCat(ctx, t, { carry: this.won() ? [] : ['tempura'] });
  }
}

// ======================================================================
// 4. だし回し — turn the bamboo pipes, mix the stocks
// ======================================================================
const STOCK = { k: '#E39A3F', n: '#5E9A4C', kn: '#D8B03A' };
class DashiGame {
  constructor(level, api) {
    this.api = api;
    this.level = level;
    this.r = level.rot.map((row) => [...row].map(Number));
    this.fixed = new Set(level.fixed || []);
    this.turns = 0;
    this.hist = [];
    this.spin = {};
    this.h = level.tiles.length;
    this.w = level.tiles[0].length;
  }
  layout(w) {
    this.u = Math.floor(Math.min((w - 8) / this.w, 66));
    this.ox = Math.floor((w - this.u * this.w) / 2);
    this.oy = 8;
    return this.u * this.h + 18;
  }
  status() { return { moves: this.turns, par: 0, label: `${this.turns}回まわした` }; }
  canUndo() { return this.hist.length > 0; }
  undo() { if (this.hist.length) { this.r = this.hist.pop(); this.turns--; } }
  down(x, y) {
    const cx = Math.floor((x - this.ox) / this.u), cy = Math.floor((y - this.oy) / this.u);
    if (cx < 0 || cy < 0 || cx >= this.w || cy >= this.h) return;
    const tile = this.level.tiles[cy][cx];
    if (!'ILTX'.includes(tile)) return;
    if (this.fixed.has(`${cx},${cy}`)) { this.spin[`${cx},${cy}`] = { t: now(), locked: true }; return; }
    if (Logic.Dashi.won(this.level, this.r)) return;
    this.hist.push(this.r.map((row) => [...row]));
    this.r[cy][cx] = (this.r[cy][cx] + 1) % 4;
    this.turns++;
    this.spin[`${cx},${cy}`] = { t: now() };
    if (Logic.Dashi.won(this.level, this.r)) setTimeout(() => this.api.won(this.status()), 600);
  }
  draw(ctx, t) {
    const { u, level } = this;
    const flow = Logic.Dashi.flow(level, this.r);
    Art.rr(ctx, this.ox - 6, this.oy - 6, this.u * this.w + 12, this.u * this.h + 12, 8);
    Art.inked(ctx, '#B98A5E', 2);
    const pipe = (cx, cy, m, chanOf, fixed, rotA) => {
      const c = { x: this.ox + (cx + 0.5) * u, y: this.oy + (cy + 0.5) * u };
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.rotate(rotA);
      const arms = [[1, 0, -1], [2, 1, 0], [4, 0, 1], [8, -1, 0]].filter(([bit]) => m & bit);
      // bamboo (or iron) tube, then what flows in it
      for (const pass of [0, 1, 2]) {
        for (const [bit, dx, dy] of arms) {
          const ch = chanOf(bit);
          const carry = flow.carry(cx, cy, ch);
          if (pass === 2 && !carry) continue;
          ctx.strokeStyle = pass === 0 ? C.ink : pass === 1 ? (fixed ? '#7D7B78' : '#C9B07A') : STOCK[carry] || '#fff';
          ctx.lineWidth = pass === 0 ? u * 0.34 : pass === 1 ? u * 0.26 : u * 0.12;
          ctx.lineCap = 'butt';
          ctx.beginPath();
          // on a crossing the E-W tube bridges over the N-S one
          ctx.moveTo(0, 0);
          ctx.lineTo(dx * u * 0.5, dy * u * 0.5);
          ctx.stroke();
        }
        if (pass < 2 && arms.length > 1 && !(m === 15)) {
          Art.ellipse(ctx, 0, 0, pass === 0 ? u * 0.17 : u * 0.13, pass === 0 ? u * 0.17 : u * 0.13, pass === 0 ? C.ink : fixed ? '#7D7B78' : '#C9B07A');
        }
      }
      if (m === 15) {
        // redraw the bridge on top
        for (const pass of [0, 1, 2]) {
          const carry = flow.carry(cx, cy, 1);
          if (pass === 2 && !carry) continue;
          ctx.strokeStyle = pass === 0 ? C.ink : pass === 1 ? (fixed ? '#8E8C88' : '#D8C08A') : STOCK[carry];
          ctx.lineWidth = pass === 0 ? u * 0.36 : pass === 1 ? u * 0.28 : u * 0.12;
          ctx.beginPath(); ctx.moveTo(-u * 0.5, 0); ctx.lineTo(u * 0.5, 0); ctx.stroke();
        }
      }
      if (fixed) for (const [dx, dy] of [[-0.3, -0.3], [0.3, -0.3], [-0.3, 0.3], [0.3, 0.3]]) Art.ellipse(ctx, dx * u, dy * u, u * 0.04, u * 0.04, '#5E5C58');
      // spill: drops at an open end
      for (const [bit, dx, dy] of arms) {
        if (!flow.spilling(cx, cy, chanOf(bit))) continue;
        const [nx, ny] = [cx + (bit === 2 ? 1 : bit === 8 ? -1 : 0), cy + (bit === 4 ? 1 : bit === 1 ? -1 : 0)];
        const nm = nx >= 0 && ny >= 0 && nx < this.w && ny < this.h ? Logic.Dashi.mask(level, this.r, nx, ny) : 0;
        const back = { 1: 4, 2: 8, 4: 1, 8: 2 }[bit];
        if (nm & back) continue;
        const k = (t * 2) % 1;
        Art.ellipse(ctx, dx * u * (0.5 + k * 0.1), dy * u * (0.5 + k * 0.1) + k * u * 0.1, u * 0.05, u * 0.07, STOCK[flow.carry(cx, cy, chanOf(bit))] || C.cold);
      }
      ctx.restore();
    };
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
      const X = this.ox + x * u, Y = this.oy + y * u;
      paperTile(ctx, X, Y, u + 0.5, u + 0.5, (x + y) % 2 ? '#E9D6B2' : '#E2CDA6');
      ctx.strokeStyle = 'rgba(58,43,34,.15)';
      ctx.strokeRect(X + 0.5, Y + 0.5, u - 1, u - 1);
      const tile = level.tiles[y][x];
      if ('ILTX'.includes(tile)) {
        const sp = this.spin[`${x},${y}`];
        const fixed = this.fixed.has(`${x},${y}`);
        let rotA = 0, m = Logic.Dashi.mask(level, this.r, x, y);
        if (sp && !sp.locked && now() - sp.t < 0.18) {
          // turn in from the previous quarter
          rotA = -(1 - ease((now() - sp.t) / 0.18)) * Math.PI / 2;
        }
        let dx2 = 0;
        if (sp && sp.locked && now() - sp.t < 0.3) dx2 = Math.sin((now() - sp.t) * 60) * 2;
        ctx.save(); ctx.translate(dx2, 0);
        pipe(x, y, m, (bit) => Logic.Dashi.chan(level, x, y, bit), fixed, rotA);
        ctx.restore();
      }
    }
    // stock pots and bowls
    for (const src of level.sources) {
      const m = { up: 1, right: 2, down: 4, left: 8 }[src.dir];
      pipe(src.x, src.y, m, () => 0, true, 0);
      const c = { x: this.ox + (src.x + 0.5) * u, y: this.oy + (src.y + 0.5) * u };
      Art.ellipse(ctx, c.x, c.y, u * 0.34, u * 0.3, '#3F3530', Math.max(1.2, u * 0.035));
      Art.ellipse(ctx, c.x, c.y - u * 0.04, u * 0.26, u * 0.16, STOCK[src.f], 1);
      ctx.fillStyle = '#FFF7EA';
      ctx.font = `${u * 0.28}px "Yusei Magic", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(src.f === 'k' ? '鰹' : '昆', c.x, c.y + u * 0.02);
    }
    level.bowls.forEach((bw, i) => {
      const m = { up: 1, right: 2, down: 4, left: 8 }[bw.dir];
      pipe(bw.x, bw.y, m, () => 0, true, 0);
      const c = { x: this.ox + (bw.x + 0.5) * u, y: this.oy + (bw.y + 0.5) * u };
      const got = flow.bowls[i];
      const want = [...bw.want].sort().join('');
      ctx.beginPath();
      ctx.moveTo(c.x - u * 0.36, c.y - u * 0.08);
      ctx.quadraticCurveTo(c.x - u * 0.32, c.y + u * 0.34, c.x, c.y + u * 0.34);
      ctx.quadraticCurveTo(c.x + u * 0.32, c.y + u * 0.34, c.x + u * 0.36, c.y - u * 0.08);
      ctx.closePath();
      Art.inked(ctx, '#FFFBF2', Math.max(1.2, u * 0.035));
      Art.ellipse(ctx, c.x, c.y - u * 0.08, u * 0.36, u * 0.12, got ? STOCK[got] || '#ccc' : '#F4EAD6', Math.max(1, u * 0.03));
      // the order: a ring in the colour this bowl wants
      ctx.lineWidth = u * 0.06;
      ctx.strokeStyle = STOCK[want];
      ctx.beginPath(); ctx.arc(c.x, c.y + u * 0.12, u * 0.12, 0, Math.PI * 2); ctx.stroke();
      if (got === want) Art.hanko(ctx, c.x + u * 0.26, c.y - u * 0.28, u * 0.14, '済');
    });
  }
}

    notes: { 1: '新しいしかけ：提灯がふたつ。', 2: '新しいしかけ：赤い和紙。通った光は赤くなる。赤い提灯は赤い光でしか灯らない。', 3: '新しいしかけ：すだれ。光を半分通して、半分曲げる（押せない）。' },
  },
  {
    id: 'fusuma', cls: FusumaGame, title: 'ふすま渡り', en: 'Sliding Doors',
    pitch: '古い宿で、ふすまを敷居にそって押し、お客さんの部屋まで天ぷらを届ける。',
    rule: 'スワイプかタップで歩く。ふすまは矢印の向きにだけ押せる。座布団の部屋まで行けば配達完了。',
    gimmicks: [['敷居にそって押す', 1], ['連動ふすま（同じ柄は一緒に動く）', 1], ['女将さんの鍵', 1], ['回り障子（押すと90度回る）', 0], ['寝ているお客さん（静かに通る）', 0], ['階段で上の階へ', 0]],
    notes: { 1: '新しいしかけ：同じ柄のふすまは一緒に動く。', 2: '新しいしかけ：鍵のかかったふすま。先に女将さんの鍵を拾う。' },
  },
  {
    id: 'dashi', cls: DashiGame, title: 'だし回し', en: 'Stock Pipes',
    pitch: '竹の樋を回して、だしをお椀まで。鰹と昆布が出会うと合わせだしになる。',
    rule: '樋をタップで回す。お椀の輪の色のだしを届け、だしを樋からこぼさない。鉄の樋は回らない。',
    gimmicks: [['樋を回す', 1], ['合わせだし（混ざる）', 1], ['回らない鉄の樋', 1], ['交差（混ざらずにすれ違う）', 1], ['栓（開け閉め）', 0], ['温度（遠いとぬるくなる）', 0]],
    notes: { 1: '新しいしかけ：鰹（橙）と昆布（緑）が出会うと合わせだし（金）。', 2: '新しいしかけ：鉄の樋は回らない。2つのだしを混ぜずに届ける。', 3: '新しいしかけ：交差する樋。縦と横は混ざらずにすれ違う。' },
  },
];

// Menu, game screen, win receipt and saved progress.
(function () {
  const $ = (s) => document.querySelector(s);
  const store = {
    get(k, d) { try { const v = localStorage.getItem('demae-neko:' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('demae-neko:' + k, JSON.stringify(v)); } catch (e) { /* storage off: play on */ } },
  };
  const cleared = (id) => store.get('cleared:' + id, []);

  let game = null, meta = null, levelIndex = 0, canvas = null, ctx = null, cssW = 0, cssH = 0, raf = 0;

  // ---------------------------------------------------------------- menu
  function buildMenu() {
    const list = $('#cards');
    list.innerHTML = '';
    let fresh = 0;
    GAMES.forEach((g, i) => {
      const done = cleared(g.id).length;
      const label = g.kept ? '残した案' : `新案${++fresh}`;
      const chips = g.gimmicks.map(([name, on]) => `<li class="${on ? 'on' : ''}">${name}</li>`).join('');
      const card = document.createElement('button');
      card.className = 'card';
      card.id = 'card-' + g.id;
      card.innerHTML = `
        <canvas class="thumb" width="1" height="1" aria-hidden="true"></canvas>
        <span class="card-text">
          <span class="card-no ${g.kept ? 'kept' : ''}">${label}</span>
          <span class="card-title">${g.title}</span>
          <span class="card-en">${g.en}</span>
          <span class="card-pitch">${g.pitch}</span>
          <span class="card-progress">${LEVELS[g.id].map((_, k) => `<i class="${cleared(g.id).includes(k) ? 'on' : ''}"></i>`).join('')}<b>${done}/${LEVELS[g.id].length}</b></span>
        </span>
        <ul class="chips" aria-label="しかけ">${chips}</ul>`;
      card.addEventListener('click', () => open(i, firstOpen(g.id)));
      list.appendChild(card);
      drawThumb(card.querySelector('canvas'), g);
    });
  }
  function firstOpen(id) {
    const c = cleared(id);
    for (let k = 0; k < LEVELS[id].length; k++) if (!c.includes(k)) return k;
    return 0;
  }
  function drawThumb(cv, g) {
    const W = 108, H = 108, dpr = window.devicePixelRatio || 1;
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    const c = cv.getContext('2d');
    c.scale(dpr, dpr);
    const inst = new g.cls(LEVELS[g.id][0], { won() {} });
    const h = inst.layout(300);
    const s = Math.min(W / 300, H / h);
    c.fillStyle = '#FBF5EA';
    c.fillRect(0, 0, W, H);
    c.save();
    c.translate((W - 300 * s) / 2, (H - h * s) / 2);
    c.scale(s, s);
    try { inst.draw(c, 0); } catch (e) { /* a thumbnail is optional */ }
    c.restore();
  }

  // ---------------------------------------------------------------- game
  function open(i, lv) {
    meta = GAMES[i];
    levelIndex = lv;
    $('#menu').hidden = true;
    $('#play').hidden = false;
    $('#g-title').textContent = meta.title;
    $('#g-rule').textContent = meta.rule;
    start();
    window.scrollTo(0, 0);
  }
  function start() {
    const lv = LEVELS[meta.id][levelIndex];
    game = new meta.cls(lv, { won });
    $('#receipt').hidden = true;
    $('#g-level').textContent = `${levelIndex + 1} / ${LEVELS[meta.id].length}`;
    const note = meta.notes[levelIndex];
    $('#g-note').textContent = note || '';
    $('#g-note').hidden = !note;
    $('#dots').innerHTML = LEVELS[meta.id].map((_, k) => `<button class="dot ${k === levelIndex ? 'cur' : ''} ${cleared(meta.id).includes(k) ? 'on' : ''}" data-k="${k}" aria-label="${k + 1}問目">${k + 1}</button>`).join('');
    $('#dots').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { levelIndex = +b.dataset.k; start(); }));
    resize();
    loop();
  }
  function resize() {
    if (!game) return;
    const box = $('#stage');
    cssW = Math.min(box.clientWidth, 520);
    cssH = game.layout(cssW);
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function loop() {
    cancelAnimationFrame(raf);
    const frame = () => {
      if (!game || $('#play').hidden) return;
      ctx.clearRect(0, 0, cssW, cssH);
      game.draw(ctx, performance.now() / 1000);
      const st = game.status();
      $('#g-moves').textContent = st.label || `${st.moves}手`;
      $('#g-par').textContent = st.label ? '' : `目標 ${st.par}手`;
      $('#undo').disabled = !game.canUndo();
      raf = requestAnimationFrame(frame);
    };
    raf = requestAnimationFrame(frame);
  }
  function won(st) {
    const c = cleared(meta.id);
    if (!c.includes(levelIndex)) store.set('cleared:' + meta.id, [...c, levelIndex]);
    const stars = st.label ? 3 : st.moves <= st.par ? 3 : st.moves <= st.par * 1.5 ? 2 : 1;
    $('#r-body').textContent = meta.id === 'pack' ? 'ぴったり詰めました'
      : meta.id === 'dashi' ? `${st.moves}回まわして、だしが届きました`
        : `${st.moves}手で配達（目標 ${st.par}手）`;
    $('#r-stars').innerHTML = [0, 1, 2].map((k) => `<i class="${k < stars ? 'on' : ''}">済</i>`).join('');
    const last = levelIndex >= LEVELS[meta.id].length - 1;
    $('#r-next').textContent = last ? 'ほかの案へ' : '次の出前へ';
    $('#receipt').hidden = false;
    $('#dots').querySelectorAll('.dot')[levelIndex].classList.add('on');
  }
  function toMenu() {
    game = null;
    cancelAnimationFrame(raf);
    $('#play').hidden = true;
    $('#menu').hidden = false;
    buildMenu();
  }

  // --------------------------------------------------------------- input
  function pos(e) {
    const r = canvas.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  }
  function wire() {
    canvas = $('#board');
    ctx = canvas.getContext('2d');
    canvas.addEventListener('pointerdown', (e) => {
      if (!game) return;
      canvas.setPointerCapture(e.pointerId);
      game.down && game.down(...pos(e));
      e.preventDefault();
    });
    canvas.addEventListener('pointermove', (e) => { if (game && game.move && e.buttons) game.move(...pos(e)); });
    canvas.addEventListener('pointerup', (e) => { if (game && game.up) game.up(...pos(e)); });
    canvas.addEventListener('pointercancel', (e) => { if (game && game.up) game.up(...pos(e)); });
    window.addEventListener('keydown', (e) => {
      if (!game) return;
      if (game.key) game.key(e.key);
      if (e.key === 'z' || e.key === 'Backspace') game.undo();
    });
    $('#undo').addEventListener('click', () => game && game.undo());
    $('#restart').addEventListener('click', () => game && start());
    $('#back').addEventListener('click', toMenu);
    $('#r-next').addEventListener('click', () => {
      if (levelIndex >= LEVELS[meta.id].length - 1) { toMenu(); return; }
      levelIndex++;
      start();
    });
    $('#r-again').addEventListener('click', start);
    $('#rule-toggle').addEventListener('click', () => { const r = $('#g-rule'); r.hidden = !r.hidden; });
    window.addEventListener('resize', resize);
  }

  function boot() {
    wire();
    buildMenu();
    // redraw thumbnails once the fonts arrive
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(buildMenu);
    const h = location.hash.replace('#', '');
    const i = GAMES.findIndex((g) => g.id === h);
    if (i >= 0) open(i, firstOpen(GAMES[i].id));
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
